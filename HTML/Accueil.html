<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SportApp – Accueil</title>
  <link rel="stylesheet" href="../CSS/Couleur.css">
  <link rel="stylesheet" href="../CSS/Accueil.css">
</head>
<body>
  <header class="bandeau">
    <nav>
      <a href="Accueil.html" class="actif">Accueil</a>
      <a href="Activite.html">Activité</a>
      <a href="Rapport.html">Rapport</a>
      <a href="Parametres.html">Paramètres</a>
      <button class="deconnexion" id="btn-deconnexion">Déconnexion</button>
    </nav>
  </header>

  <main>

    <!-- Logo -->
    <div class="logo">
      <svg class="logo-icone" viewBox="0 0 64 64" role="img" aria-label="Logo SportApp">
        <rect x="4"  y="24" width="6"  height="16" rx="2"/>
        <rect x="11" y="18" width="7"  height="28" rx="2"/>
        <rect x="18" y="29" width="28" height="6"  rx="2"/>
        <rect x="46" y="18" width="7"  height="28" rx="2"/>
        <rect x="54" y="24" width="6"  height="16" rx="2"/>
      </svg>
      <span class="logo-nom">SportApp</span>
    </div>

    <!-- Séance du jour + récap de la séance précédente -->
    <section class="hero" id="hero">
      <small id="date-jour"></small>
      <h1 id="seance-jour"></h1>

      <details class="recap" id="recap" hidden>
        <summary>
          <span class="txt-ferme">Afficher la séance précédente</span>
          <span class="txt-ouvert">Masquer la séance précédente</span>
        </summary>
        <div class="recap-contenu">
          <div class="recap-titre">Dernière séance <span id="recap-type"></span></div>
          <div class="mut" id="recap-date"></div>
          <div class="recap-notes" id="recap-notes"></div>
        </div>
      </details>
    </section>

      

    <!-- Infos de base -->
    <section class="card">
      <div class="row">
        <div>
          <div class="id" id="identite"></div>
          <div class="mut" id="naissance"></div>
        </div>
        <div>
          <div class="mut">Poids actuel</div>
          <div class="poids" id="poids">—</div>
        </div>
      </div>

      <label for="nouveau-poids">Mettre à jour mon poids (kg)</label>
      <div class="row">
        <input id="nouveau-poids" type="number" step="0.1" min="0">
        <button class="btn" id="btn-poids">Enregistrer</button>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../JS/supabase.js"></script>
  <script src="../JS/donnees.js"></script>
  <script>
    const JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];

    function calculerAge(dateNaissance) {
      const n = new Date(dateNaissance);
      const auj = new Date();
      let age = auj.getFullYear() - n.getFullYear();
      const anniversaire = new Date(auj.getFullYear(), n.getMonth(), n.getDate());
      if (auj < anniversaire) age--;
      return age;
    }

        function joursDepuis(dateTexte) {
      const a = new Date(aujourdhui() + "T12:00:00");
      const b = new Date(dateTexte + "T12:00:00");
      return Math.round((a - b) / 86400000);
    }

    async function afficherRecap(seance) {
      const bloc = document.getElementById("recap");
      if (seance === "Repos") {
        bloc.hidden = true;
        return;
      }

      // La liste est déjà triée de la séance la plus récente à la plus ancienne
      const liste = await chargerSeances();
      const cle = seance.toLowerCase();
      const derniere = liste.find(function (s) {
        return s.date < aujourdhui() && s.type.trim().toLowerCase().startsWith(cle);
      });

      const type = document.getElementById("recap-type");
      const date = document.getElementById("recap-date");
      const notes = document.getElementById("recap-notes");
      type.textContent = seance;
      type.className = "recap-type " + cle;
      bloc.hidden = false;

      if (!derniere) {
        date.textContent = "";
        notes.textContent = "Aucune séance " + seance + " enregistrée pour l’instant. Ajoute-la dans l’onglet Activité.";
        return;
      }

      const n = joursDepuis(derniere.date);
      date.textContent =
        new Date(derniere.date + "T12:00:00").toLocaleDateString("fr-FR", {
          weekday: "long", day: "numeric", month: "long", year: "numeric"
        }) + " · il y a " + n + " jour" + (n > 1 ? "s" : "");
      notes.textContent = derniere.notes || "Aucun détail enregistré pour cette séance.";
    }

    async function afficher() {
      const p = await chargerProfil();
      const maintenant = new Date();
      const indexJour = (maintenant.getDay() + 6) % 7; // lundi = 0
      const seance = p.programme[indexJour];

      // Séance du jour
      document.getElementById("date-jour").textContent =
        JOURS[indexJour] + " " +
        maintenant.toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
      document.getElementById("seance-jour").textContent = seance.toUpperCase();
      document.getElementById("hero").className = "hero " + seance.toLowerCase();

      await afficherRecap(seance);

      // Identité
      const nomComplet = (p.prenom + " " + p.nom.toUpperCase()).trim();
      document.getElementById("identite").textContent =
        nomComplet || "Renseigne ton nom dans Paramètres";
      document.getElementById("naissance").textContent = p.naissance
        ? "Né(e) le " + new Date(p.naissance).toLocaleDateString("fr-FR") +
          " · " + calculerAge(p.naissance) + " ans"
        : "";

      // Poids
      document.getElementById("poids").textContent = p.poids ? p.poids + " kg" : "—";
    }

    document.getElementById("btn-deconnexion").addEventListener("click", deconnexion);

    document.getElementById("btn-poids").addEventListener("click", async function () {
      const champ = document.getElementById("nouveau-poids");
      const valeur = parseFloat(champ.value.replace(",", "."));
      if (!valeur || valeur <= 0) return;
      try {
        await ajouterPoids(valeur);
        champ.value = "";
        await afficher();
      } catch (e) {
        alert("Erreur : " + e.message);
      }
    });

    (async function () {
      const user = await exigerConnexion();
      if (!user) return;
      try {
        await afficher();
      } catch (e) {
        alert("Erreur de chargement : " + e.message);
      }
    })();
  </script>
</body>
</html>
