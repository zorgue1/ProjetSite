<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SportApp – Accueil</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#090d13">
  <link rel="apple-touch-icon" href="../Image/icon-180.png">
  <script src="../JS/theme.js"></script>
  <link rel="stylesheet" href="../CSS/Couleur.css">
  <link rel="stylesheet" href="../CSS/Commun.css">
  <link rel="stylesheet" href="../CSS/Accueil.css">
</head>
<body>
  <!-- Icône de flamme réutilisée dans la page -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="flamme" viewBox="0 0 24 24">
      <path d="M12 2C13 6 17.5 8 18 13.5C18.3 17.5 15.5 21.5 12 21.5C8.5 21.5 5.7 18.5 6 14.5C6.2 12.2 7.2 10.6 8.6 9.4C9 11 9.6 12 10.8 12.6C10.2 8.5 10.6 5 12 2Z"/>
    </symbol>
  </svg>

  <header class="bandeau" id="entete"></header>
  <script src="../JS/entete.js"></script>

  <main>

    <!-- Série et calendrier -->
    <section class="card serie">
      <div class="serie-tete">
        <div class="serie-score">
          <svg class="serie-flamme" id="serie-flamme" aria-hidden="true"><use href="#flamme"/></svg>
          <div>
            <div class="serie-nombre" id="serie-nombre">0</div>
            <div class="serie-label" id="serie-label"></div>
          </div>
        </div>
        <div class="serie-semaine">
          <div class="stat-titre">Cette semaine</div>
          <div class="serie-semaine-valeur" id="semaine-compte">0</div>
        </div>
      </div>

      <p class="mut" id="serie-message"></p>

      <div class="semaine" id="semaine"></div>

      <details class="mois-details">
        <summary>Voir le mois</summary>
        <div class="mois-nav">
          <button type="button" id="mois-prec" aria-label="Mois précédent">‹</button>
          <strong id="mois-titre"></strong>
          <button type="button" id="mois-suiv" aria-label="Mois suivant">›</button>
        </div>
        <div class="mois-entete">
          <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div class="mois-grille" id="mois-grille"></div>
      </details>
    </section>

    <!-- Séance du jour -->
    <section class="hero" id="hero">
      <small id="date-jour"></small>
      <h1 id="seance-jour"></h1>

      <a class="btn cta" href="Activite.html">Commencer la séance</a>

      <details class="recap" id="recap" hidden>
        <summary>
          <span class="txt-ferme">Afficher la séance précédente</span>
          <span class="txt-ouvert">Masquer la séance précédente</span>
        </summary>
        <div class="recap-contenu">
          <div class="recap-titre">Dernière séance <span id="recap-type"></span></div>
          <div class="mut" id="recap-date"></div>
          <div class="recap-exercices" id="recap-exercices"></div>
          <div class="recap-notes" id="recap-notes"></div>
        </div>
      </details>
    </section>

    <!-- Menu -->
    <section class="menu-tuiles">
      <a class="carte-menu" href="Activite.html">
        <span class="carte-icone">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="4" width="14" height="17" rx="2"/>
            <path d="M9 4h6v3H9z"/>
            <line x1="8.5" y1="12" x2="15.5" y2="12"/>
            <line x1="8.5" y1="16" x2="13" y2="16"/>
          </svg>
        </span>
        <span class="carte-texte"><strong>Activité</strong><small>Saisir une séance, historique</small></span>
        <span class="carte-fleche" aria-hidden="true">›</span>
      </a>

      <a class="carte-menu" href="Exercices.html">
        <span class="carte-icone">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2" y="9" width="3" height="6" rx="1"/>
            <rect x="5" y="6" width="3" height="12" rx="1"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
            <rect x="16" y="6" width="3" height="12" rx="1"/>
            <rect x="19" y="9" width="3" height="6" rx="1"/>
          </svg>
        </span>
        <span class="carte-texte"><strong>Exercices</strong><small>Ma bibliothèque</small></span>
        <span class="carte-fleche" aria-hidden="true">›</span>
      </a>

      <a class="carte-menu" href="Rapport.html">
        <span class="carte-icone">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="4" y1="20" x2="20" y2="20"/>
            <rect x="6" y="12" width="3" height="8"/>
            <rect x="11" y="7" width="3" height="13"/>
            <rect x="16" y="3" width="3" height="17"/>
          </svg>
        </span>
        <span class="carte-texte"><strong>Rapport</strong><small>Progression et records</small></span>
        <span class="carte-fleche" aria-hidden="true">›</span>
      </a>
    </section>

    <!-- Profil -->
    <section class="card profil">
      <div class="profil-tete">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="profil-nom" id="identite"></div>
          <div class="mut" id="naissance"></div>
        </div>
      </div>

      <div class="profil-stats">
        <div class="stat">
          <span class="stat-titre">Poids</span>
          <span class="stat-valeur" id="poids">—</span>
        </div>
        <div class="stat">
          <span class="stat-titre">Évolution</span>
          <span class="stat-valeur" id="evolution">—</span>
        </div>
        <div class="stat">
          <span class="stat-titre">Séances</span>
          <span class="stat-valeur" id="total-seances">0</span>
        </div>
      </div>

      <button class="btn secondaire petit" id="btn-maj-poids" type="button">Mettre à jour mon poids</button>
      <div class="maj-poids" id="maj-poids" hidden>
        <input id="nouveau-poids" type="number" step="0.1" min="0" inputmode="decimal"
               placeholder="Poids en kg" aria-label="Nouveau poids en kg">
        <button class="btn" id="btn-poids" type="button">Enregistrer</button>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../JS/supabase.js"></script>
  <script src="../JS/donnees.js"></script>
  <script>
    const JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
    const LETTRES = ["L", "M", "M", "J", "V", "S", "D"];

    let programme = PROGRAMME_DEFAUT;
    let datesFaites = new Set();      // dates où une séance a été enregistrée
    let moisAffiche = new Date();
    moisAffiche.setDate(1);

    // Crée un élément HTML (le texte est inséré en toute sécurité)
    function el(balise, classe, texte) {
      const e = document.createElement(balise);
      if (classe) e.className = classe;
      if (texte) e.textContent = texte;
      return e;
    }

    // Date au format AAAA-MM-JJ (heure locale)
    function versTexte(date) {
      const d = new Date(date.getTime());
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }

    function calculerAge(dateNaissance) {
      const n = new Date(dateNaissance);
      const auj = new Date();
      let age = auj.getFullYear() - n.getFullYear();
      const anniversaire = new Date(auj.getFullYear(), n.getMonth(), n.getDate());
      if (auj < anniversaire) age--;
      return age;
    }

    function joursDepuis(dateTexte) {
      const a = new Date(aujourdhui() + "T12:00:00");
      const b = new Date(dateTexte + "T12:00:00");
      return Math.round((a - b) / 86400000);
    }

    /* ---------- Série ---------- */

    // Jours d'entraînement de suite, selon le programme :
    // un repos prévu ne casse pas la série, un jour d'entraînement prévu manqué la casse,
    // et aujourd'hui ne compte pas comme manqué tant que la journée n'est pas finie.
    function calculerSerie() {
      let serie = 0;
      const base = new Date();
      base.setHours(12, 0, 0, 0);
      for (let i = 0; i < 400; i++) {
        const d = new Date(base);
        d.setDate(base.getDate() - i);
        const prevu = !estRepos(programme[(d.getDay() + 6) % 7]);
        if (datesFaites.has(versTexte(d))) serie++;
        else if (i === 0) continue;
        else if (prevu) break;
      }
      return serie;
    }

    function iconeFlamme() {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("aria-hidden", "true");
      const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
      use.setAttribute("href", "#flamme");
      svg.appendChild(use);
      return svg;
    }

    // Une case du calendrier : flamme si séance faite, sinon le numéro du jour
    function creerJour(texte, lettre) {
      const d = new Date(texte + "T12:00:00");
      const prevu = programme[(d.getDay() + 6) % 7];
      const fait = datesFaites.has(texte);
      const auj = texte === aujourdhui();
      const futur = texte > aujourdhui();

      const cellule = el("div", "jour" + (fait ? " fait" : "") + (auj ? " auj" : "") + (futur ? " futur" : ""));
      const longue = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
      cellule.title = longue + (fait ? " : séance faite" : !estRepos(prevu) ? " : " + prevu + " prévu" : " : repos");

      if (lettre) cellule.appendChild(el("span", "jour-lettre", lettre));

      const rond = el("span", "jour-rond");
      if (fait) rond.appendChild(iconeFlamme());
      else rond.textContent = String(d.getDate());
      cellule.appendChild(rond);

      // Petit point de la couleur de la séance prévue (si elle n'est pas encore faite)
      cellule.appendChild(el("span", "jour-point " + (!estRepos(prevu) && !fait ? classeSeance(prevu) : "")));
      return cellule;
    }

    function afficherSemaine() {
      const zone = document.getElementById("semaine");
      zone.innerHTML = "";
      const lundi = new Date();
      lundi.setHours(12, 0, 0, 0);
      lundi.setDate(lundi.getDate() - ((lundi.getDay() + 6) % 7));

      let compte = 0;
      for (let i = 0; i < 7; i++) {
        const d = new Date(lundi);
        d.setDate(lundi.getDate() + i);
        const texte = versTexte(d);
        if (datesFaites.has(texte)) compte++;
        zone.appendChild(creerJour(texte, LETTRES[i]));
      }
      document.getElementById("semaine-compte").textContent = compte;
    }

    function afficherMois() {
      const annee = moisAffiche.getFullYear();
      const mois = moisAffiche.getMonth();
      const titre = moisAffiche.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
      document.getElementById("mois-titre").textContent = titre.charAt(0).toUpperCase() + titre.slice(1);

      const grille = document.getElementById("mois-grille");
      grille.innerHTML = "";
      const decalage = (new Date(annee, mois, 1).getDay() + 6) % 7;
      for (let i = 0; i < decalage; i++) grille.appendChild(el("div"));

      const nb = new Date(annee, mois + 1, 0).getDate();
      for (let j = 1; j <= nb; j++) {
        grille.appendChild(creerJour(versTexte(new Date(annee, mois, j, 12)), null));
      }
    }

    function afficherSerie() {
      const serie = calculerSerie();
      document.getElementById("serie-nombre").textContent = serie;
      document.getElementById("serie-label").textContent = serie === 0
        ? "Lance ta série aujourd’hui"
        : (serie === 1 ? "jour d’entraînement de suite" : "jours d’entraînement de suite");
      document.getElementById("serie-flamme").setAttribute("class", "serie-flamme" + (serie === 0 ? " eteinte" : ""));

      const indexAuj = (new Date().getDay() + 6) % 7;
      const prevuAuj = programme[indexAuj];
      document.getElementById("serie-message").textContent = datesFaites.has(aujourdhui())
        ? "Séance du jour validée, bravo !"
        : (estRepos(prevuAuj)
            ? "Jour de repos : ta série est préservée."
            : "Il reste ta séance " + prevuAuj + " pour continuer la série.");

      afficherSemaine();
      afficherMois();
    }

    /* ---------- Récap de la séance précédente ---------- */

    async function afficherRecap(seance, liste) {
      const bloc = document.getElementById("recap");
      if (estRepos(seance)) {
        bloc.hidden = true;
        return;
      }

      // La liste est déjà triée de la séance la plus récente à la plus ancienne
      const cle = seance.toLowerCase();
      const derniere = liste.find(function (s) {
        return s.date < aujourdhui() && s.type.trim().toLowerCase().startsWith(cle);
      });

      const type = document.getElementById("recap-type");
      const date = document.getElementById("recap-date");
      const zoneExos = document.getElementById("recap-exercices");
      const notes = document.getElementById("recap-notes");
      type.textContent = seance;
      type.className = "recap-type " + classeSeance(seance);
      zoneExos.innerHTML = "";
      bloc.hidden = false;

      if (!derniere) {
        date.textContent = "";
        notes.textContent = "Aucune séance " + seance + " enregistrée pour l’instant. Ajoute-la dans l’onglet Activité.";
        return;
      }

      const n = joursDepuis(derniere.date);
      date.textContent =
        new Date(derniere.date + "T12:00:00").toLocaleDateString("fr-FR", {
          weekday: "long", day: "numeric", month: "long", year: "numeric"
        }) + " · il y a " + n + " jour" + (n > 1 ? "s" : "");

      // Exercices, séries et charges de cette séance
      let exos = [];
      try {
        exos = grouperSeries(await chargerSeries([derniere.id]))[derniere.id] || [];
      } catch (e) {}
      exos.forEach(function (ex) {
        zoneExos.appendChild(creerLigneExercice(ex));
      });

      notes.textContent = derniere.notes ||
        (exos.length ? "" : "Aucun détail enregistré pour cette séance.");
    }

    /* ---------- Profil ---------- */

    function afficherProfil(p, seances, poids) {
      const initiales = (p.prenom.charAt(0) + p.nom.charAt(0)).toUpperCase();
      document.getElementById("avatar").textContent = initiales || "?";

      const nomComplet = (p.prenom + " " + p.nom.toUpperCase()).trim();
      document.getElementById("identite").textContent =
        nomComplet || "Renseigne ton nom dans Paramètres";
      document.getElementById("naissance").textContent = p.naissance
        ? calculerAge(p.naissance) + " ans · né(e) le " + new Date(p.naissance).toLocaleDateString("fr-FR")
        : "";

      document.getElementById("poids").textContent =
        p.poids ? String(p.poids).replace(".", ",") + " kg" : "—";

      // Évolution depuis la pesée précédente
      let evolution = "—";
      if (poids.length >= 2) {
        const delta = Math.round((Number(poids[poids.length - 1].valeur) - Number(poids[poids.length - 2].valeur)) * 10) / 10;
        evolution = (delta > 0 ? "+" : delta < 0 ? "−" : "") + String(Math.abs(delta)).replace(".", ",") + " kg";
      }
      document.getElementById("evolution").textContent = evolution;
      document.getElementById("total-seances").textContent = seances.length;
    }

    /* ---------- Chargement ---------- */

    async function afficher() {
      const r = await Promise.all([chargerProfil(), chargerSeances(), chargerPoids()]);
      const p = r[0], seances = r[1], poids = r[2];

      programme = p.programme;
      datesFaites = new Set(seances.map(function (s) { return s.date; }));
      afficherSerie();

      // Séance du jour
      const maintenant = new Date();
      const indexJour = (maintenant.getDay() + 6) % 7; // lundi = 0
      const seance = programme[indexJour];
      document.getElementById("date-jour").textContent =
        JOURS[indexJour] + " " +
        maintenant.toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
            const titre = document.getElementById("seance-jour");
      titre.textContent = seance.toUpperCase();
      // Les noms longs s'affichent un peu plus petits pour tenir dans la carte
      titre.className = seance.length > 14 ? "tres-long" : (seance.length > 7 ? "long" : "");
      document.getElementById("hero").className = "hero " + classeSeance(seance);

      await afficherRecap(seance, seances);
      afficherProfil(p, seances, poids);
    }

    document.getElementById("mois-prec").addEventListener("click", function () {
      moisAffiche.setMonth(moisAffiche.getMonth() - 1);
      afficherMois();
    });
    document.getElementById("mois-suiv").addEventListener("click", function () {
      moisAffiche.setMonth(moisAffiche.getMonth() + 1);
      afficherMois();
    });

    document.getElementById("btn-maj-poids").addEventListener("click", function () {
      const zone = document.getElementById("maj-poids");
      zone.hidden = !zone.hidden;
      if (!zone.hidden) document.getElementById("nouveau-poids").focus();
    });

    document.getElementById("btn-poids").addEventListener("click", async function () {
      const champ = document.getElementById("nouveau-poids");
      const valeur = parseFloat(champ.value.replace(",", "."));
      if (!valeur || valeur <= 0) return;
      try {
        await ajouterPoids(valeur);
        champ.value = "";
        document.getElementById("maj-poids").hidden = true;
        await afficher();
      } catch (e) {
        alert("Erreur : " + e.message);
      }
    });

    (async function () {
      const user = await exigerConnexion();
      if (!user) return;
      try {
        await afficher();
      } catch (e) {
        alert("Erreur de chargement : " + e.message);
      }
    })();
  </script>
</body>
</html>
