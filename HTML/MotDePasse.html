<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SportApp – Nouveau mot de passe</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#090d13">
  <link rel="apple-touch-icon" href="../Image/icon-180.png">
  <script src="../JS/theme.js"></script>
  <link rel="stylesheet" href="../CSS/Couleur.css">
  <link rel="stylesheet" href="../CSS/Commun.css">
  <link rel="stylesheet" href="../CSS/Connexion.css">
</head>
<body>
  <main>
    <div class="logo">
      <svg class="logo-icone" viewBox="0 0 64 64" role="img" aria-label="Logo SportApp">
        <rect x="4"  y="24" width="6"  height="16" rx="2"/>
        <rect x="11" y="18" width="7"  height="28" rx="2"/>
        <rect x="18" y="29" width="28" height="6"  rx="2"/>
        <rect x="46" y="18" width="7"  height="28" rx="2"/>
        <rect x="54" y="24" width="6"  height="16" rx="2"/>
      </svg>
      <span class="logo-nom">SportApp</span>
    </div>

    <section class="card">
      <h2>Nouveau mot de passe</h2>

      <!-- Affiché quand on arrive par le lien reçu par e-mail -->
      <div id="formulaire" hidden>
        <label for="mdp1">Nouveau mot de passe (6 caractères minimum)</label>
        <input id="mdp1" type="password" autocomplete="new-password">
        <label for="mdp2">Confirme le mot de passe</label>
        <input id="mdp2" type="password" autocomplete="new-password">
        <div class="actions">
          <button class="btn" id="btn-valider" type="button">Enregistrer</button>
        </div>
      </div>

      <p id="message" role="status">Vérification du lien…</p>
      <p class="mut aide" id="retour" hidden><a href="Connexion.html">‹ Retour à la connexion</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../JS/supabase.js"></script>
  <script>
    const message = document.getElementById("message");

    function afficherMessage(texte, erreur) {
      message.textContent = texte;
      message.className = erreur ? "erreur" : "ok";
    }

    function montrerFormulaire() {
      document.getElementById("formulaire").hidden = false;
      afficherMessage("", false);
    }

    // Le lien de l'e-mail connecte temporairement : la bibliothèque Supabase le lit dans l'adresse
    client.auth.onAuthStateChange(function (evenement, session) {
      if (evenement === "PASSWORD_RECOVERY" || session) montrerFormulaire();
    });

    setTimeout(async function () {
      const r = await client.auth.getSession();
      if (r.data.session) return montrerFormulaire();
      afficherMessage("Ce lien n’est plus valable. Redemande un e-mail depuis « Mot de passe oublié ? ».", true);
      document.getElementById("retour").hidden = false;
    }, 1500);

    document.getElementById("btn-valider").addEventListener("click", async function () {
      const mdp1 = document.getElementById("mdp1").value;
      const mdp2 = document.getElementById("mdp2").value;
      if (mdp1.length < 6) return afficherMessage("Le mot de passe doit faire au moins 6 caractères.", true);
      if (mdp1 !== mdp2) return afficherMessage("Les deux mots de passe ne sont pas identiques.", true);

      this.disabled = true;
      const { error } = await client.auth.updateUser({ password: mdp1 });
      this.disabled = false;
      if (error) return afficherMessage("Changement impossible : " + error.message, true);

      afficherMessage("Mot de passe changé ! Redirection vers l’accueil…", false);
      setTimeout(function () { window.location.replace("Accueil.html"); }, 1500);
    });

    document.querySelectorAll("input").forEach(function (champ) {
      champ.addEventListener("keydown", function (e) {
        if (e.key === "Enter") document.getElementById("btn-valider").click();
      });
    });
  </script>
</body>
</html>
