<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://unzyqfkxgfepvzirnmfd.supabase.co wss://unzyqfkxgfepvzirnmfd.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SportApp – Records</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#090d13">
  <link rel="apple-touch-icon" href="../Image/icon-180.png">
  <script src="../JS/theme.js"></script>
  <link rel="stylesheet" href="../CSS/Couleur.css">
  <link rel="stylesheet" href="../CSS/Commun.css">
  <link rel="stylesheet" href="../CSS/Records.css">
</head>
<body>
  <header class="bandeau" id="entete"></header>
  <script src="../JS/entete.js"></script>

  <main>

    <div class="entete-page">
      <h2>Mes PR</h2>
      <button class="btn" id="btn-nouveau" type="button">+ Nouveau PR</button>
    </div>

    <p class="confirmation" id="confirmation" role="status" hidden></p>
    <p class="vide alerte" id="alerte" hidden></p>

    <!-- Formulaire : nouveau PR à 1 rep -->
    <section class="card" id="formulaire" hidden>
      <h2>Nouveau PR</h2>

      <label for="pr-exo">Exercice</label>
      <select id="pr-exo"></select>
      <p class="mut pr-indice" id="pr-indice"></p>

      <div class="row">
        <div>
          <label for="pr-charge">Charge sur 1 rep</label>
          <div class="champ-unite grand">
            <input id="pr-charge" type="number" min="0" step="0.5" inputmode="decimal" placeholder="100">
            <span>kg</span>
          </div>
        </div>
        <div>
          <label for="pr-date">Date</label>
          <input id="pr-date" type="date">
        </div>
      </div>

      <label for="pr-note">Note <span class="facultatif">(facultatif)</span></label>
      <input id="pr-note" type="text" maxlength="80" placeholder="Avec ceinture, pause en bas…">

      <div class="actions">
        <button class="btn" id="btn-enregistrer" type="button">Enregistrer le PR</button>
        <button class="btn secondaire" id="btn-annuler" type="button">Annuler</button>
      </div>
    </section>

    <!-- Dernier PR battu -->
    <section class="vedette" id="vedette" hidden></section>

    <!-- PR à 1 rep, un par exercice -->
    <section class="pr-grille" id="pr-grille"></section>

    <!-- Records calculés à partir des séances -->
    <div class="section-tete">
      <h3>Records en séries</h3>
      <span class="mut">Calculés depuis tes séances</span>
    </div>
    <input id="recherche" type="search" placeholder="Rechercher un exercice…" autocomplete="off">
    <div class="chips" id="chips"></div>
    <section id="liste"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js" integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ" crossorigin="anonymous"></script>
  <script src="../JS/supabase.js"></script>
  <script src="../JS/donnees.js"></script>
  <script>
    let exercices = [];
    let records = {};          // records en séries, indexés par identifiant d'exercice
    let prs = [];              // résumé des PR à 1 rep (un par exercice)
    let muscleChoisi = "Tous";
    let verifies = null;       // identifiants des PR vérifiés par la base (null : défis pas activés)

    const $ = function (id) { return document.getElementById(id); };
    const exoDe = function (id) { return exercices.find(function (e) { return e.id === id; }); };

    function erreurLisible(e) {
      const m = (e && e.message) || String(e);
      if (/prs|42P01|PGRST205/.test(m + " " + (e && e.code))) {
        return "La table des PR n’existe pas encore : exécute le script SQL « prs » dans Supabase (SQL Editor), puis recharge la page.";
      }
      return "Erreur : " + m;
    }

    // « aujourd'hui », « hier », « il y a 5 jours », sinon la date
    function ilYa(texte) {
      const jours = Math.round((enDate(aujourdhui()) - enDate(texte)) / 86400000);
      if (jours <= 0) return "aujourd’hui";
      if (jours === 1) return "hier";
      if (jours < 30) return "il y a " + jours + " jours";
      return "le " + dateFr(texte);
    }

    /* ---------- Dernier PR en vedette ---------- */

    function afficherVedette() {
      const zone = $("vedette");
      const dernier = prs.slice().sort(function (a, b) {
        return b.meilleur.date.localeCompare(a.meilleur.date) || b.meilleur.id - a.meilleur.id;
      })[0];
      const ex = dernier && exoDe(dernier.exercice_id);
      if (!ex) { zone.hidden = true; return; }

      zone.innerHTML = "";
      zone.hidden = false;
      zone.appendChild(el("span", "vedette-etiquette", "Dernier PR · " + ilYa(dernier.meilleur.date)));
      zone.appendChild(el("div", "vedette-exo", ex.nom));
      const valeur = el("div", "vedette-valeur");
      valeur.appendChild(document.createTextNode(nb(dernier.meilleur.charge)));
      valeur.appendChild(el("small", "", "kg"));
      zone.appendChild(valeur);
      if (dernier.gain > 0) zone.appendChild(el("span", "gain", "+" + nb(dernier.gain) + " kg"));
    }

    // « ✓ » si le PR est cohérent avec tes séries récentes, « ? » sinon
    function marqueVerif(pr) {
      if (!verifies) return document.createTextNode("");
      const ok = verifies.has(String(pr.id));
      const m = el("span", "verif" + (ok ? " ok" : ""), ok ? "✓ vérifié" : "?");
      m.title = ok ? "PR cohérent avec tes séries des 60 derniers jours"
        : "Non vérifié : aucune série récente sur cet exercice ne le confirme (pas d’XP)";
      return m;
    }

    /* ---------- Cartes des PR à 1 rep ---------- */

    function afficherPRs() {
      const zone = $("pr-grille");
      zone.innerHTML = "";

      const visibles = prs.filter(function (p) { return exoDe(p.exercice_id); })
        .sort(function (a, b) { return Number(b.meilleur.charge) - Number(a.meilleur.charge); });

      if (!visibles.length) {
        const vide = el("div", "vide pr-vide");
        vide.appendChild(el("strong", "", "Aucun PR pour l’instant"));
        vide.appendChild(el("span", "", "Note ta meilleure charge sur 1 répétition (squat, développé couché, soulevé de terre…) pour suivre ta force."));
        zone.appendChild(vide);
        return;
      }

      visibles.forEach(function (p) {
        const ex = exoDe(p.exercice_id);
        const carte = el("details", "card pr-carte");
        const resume = el("summary", "pr-resume");

        const tete = el("div", "pr-tete");
        tete.appendChild(creerVignette(ex));
        const titre = el("div", "pr-titre");
        titre.appendChild(el("div", "exo-nom-ligne", ex.nom));
        titre.appendChild(el("div", "mut", ex.muscle));
        tete.appendChild(titre);
        resume.appendChild(tete);

        const valeur = el("div", "pr-valeur");
        valeur.appendChild(document.createTextNode(nb(p.meilleur.charge)));
        valeur.appendChild(el("small", "", "kg"));
        resume.appendChild(valeur);

        const pied = el("div", "pr-pied");
        pied.appendChild(el("span", "mut", dateFr(p.meilleur.date)));
        if (p.gain > 0) pied.appendChild(el("span", "gain", "+" + nb(p.gain) + " kg"));
        pied.appendChild(marqueVerif(p.meilleur));
        resume.appendChild(pied);
        carte.appendChild(resume);

        // Historique (du plus récent au plus ancien)
        const histo = el("div", "pr-histo");
        p.historique.slice().reverse().forEach(function (h) {
          const ligne = el("div", "histo-ligne" + (h.id === p.meilleur.id ? " record" : ""));
          ligne.appendChild(el("span", "histo-date", dateFr(h.date)));
          const centre = el("span", "histo-centre");
          const charge = el("strong", "", nb(h.charge) + " kg");
          charge.appendChild(marqueVerif(h));
          centre.appendChild(charge);
          if (h.note) centre.appendChild(el("span", "mut", h.note));
          ligne.appendChild(centre);
          const suppr = el("button", "histo-suppr", "×");
          suppr.type = "button";
          suppr.setAttribute("aria-label", "Supprimer ce PR du " + dateFr(h.date));
          suppr.addEventListener("click", async function () {
            if (!confirm("Supprimer le PR de " + nb(h.charge) + " kg du " + dateFr(h.date) + " ?")) return;
            try {
              await supprimerPR(h.id);
              await chargerPRsEtAfficher();
            } catch (e) {
              alert(erreurLisible(e));
            }
          });
          ligne.appendChild(suppr);
          histo.appendChild(ligne);
        });
        carte.appendChild(histo);
        zone.appendChild(carte);
      });
    }

    async function chargerPRsEtAfficher() {
      try {
        prs = resumerPRs(await chargerPRs());
        try { verifies = new Set((await chargerXP()).pr_verifies.map(String)); } catch (e) { verifies = null; }
        $("alerte").hidden = true;
      } catch (e) {
        prs = [];
        $("alerte").textContent = erreurLisible(e);
        $("alerte").hidden = false;
      }
      afficherVedette();
      afficherPRs();
    }

    /* ---------- Formulaire ---------- */

    function remplirExercices() {
      const select = $("pr-exo");
      select.innerHTML = "";
      MUSCLES.forEach(function (m) {
        const liste = exercices.filter(function (e) { return e.muscle === m; });
        if (!liste.length) return;
        const groupe = document.createElement("optgroup");
        groupe.label = m;
        liste.forEach(function (e) {
          const o = el("option", "", e.nom);
          o.value = e.id;
          groupe.appendChild(o);
        });
        select.appendChild(groupe);
      });
    }

    // Rappelle le PR actuel et le 1RM estimé pour l'exercice choisi
    function indice() {
      const id = exercices.length ? exoDe(castId($("pr-exo").value)) : null;
      const p = id && prs.find(function (x) { return x.exercice_id === id.id; });
      const r = id && records[id.id];
      const morceaux = [];
      if (p) morceaux.push("PR actuel : " + nb(p.meilleur.charge) + " kg (" + dateFr(p.meilleur.date) + ")");
      if (r && Number(r.rm_max) > 0) morceaux.push("1RM estimé d’après tes séances : " + nb(r.rm_max) + " kg");
      $("pr-indice").textContent = morceaux.join(" · ");
      $("pr-indice").hidden = !morceaux.length;
    }

    // Les identifiants d'exercice peuvent être des nombres ou des textes (uuid)
    function castId(v) {
      const ex = exercices.find(function (e) { return String(e.id) === String(v); });
      return ex ? ex.id : v;
    }

    function ouvrirFormulaire() {
      if (!exercices.length) {
        alert("Ta bibliothèque d’exercices est vide : ajoute d’abord des exercices dans Sport → Exercices.");
        return;
      }
      $("formulaire").hidden = false;
      $("btn-nouveau").hidden = true;
      $("pr-date").value = aujourdhui();
      indice();
      $("pr-charge").focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function fermerFormulaire() {
      $("formulaire").hidden = true;
      $("btn-nouveau").hidden = false;
      $("pr-charge").value = "";
      $("pr-note").value = "";
    }

    $("btn-nouveau").addEventListener("click", ouvrirFormulaire);
    $("btn-annuler").addEventListener("click", fermerFormulaire);
    $("pr-exo").addEventListener("change", indice);
    $("pr-charge").addEventListener("keydown", function (e) {
      if (e.key === "Enter") $("btn-enregistrer").click();
    });

    $("btn-enregistrer").addEventListener("click", async function () {
      const exoId = castId($("pr-exo").value);
      const charge = parseFloat($("pr-charge").value.replace(",", "."));
      if (!(charge > 0)) { $("pr-charge").focus(); return alert("Indique la charge soulevée sur 1 répétition."); }

      const avant = prs.find(function (p) { return p.exercice_id === exoId; });
      const bouton = this;
      bouton.disabled = true;
      try {
        await ajouterPR({
          exercice_id: exoId,
          charge: charge,
          date: $("pr-date").value || aujourdhui(),
          note: $("pr-note").value.trim() || null
        });
        fermerFormulaire();
        const nom = exoDe(exoId).nom;
        if (!avant) confirmer("Premier PR enregistré : " + nom + " " + nb(charge) + " kg");
        else if (charge > Number(avant.meilleur.charge)) confirmer("Nouveau record ! " + nom + " : +" + nb(charge - avant.meilleur.charge) + " kg");
        else confirmer("PR ajouté à l’historique de " + nom);
        await chargerPRsEtAfficher();
      } catch (e) {
        alert(erreurLisible(e));
      } finally {
        bouton.disabled = false;
      }
    });

    /* ---------- Records en séries ---------- */

    // Pastilles : seulement les muscles qui ont au moins un record
    function afficherChips() {
      const zone = $("chips");
      zone.innerHTML = "";
      const avecRecord = exercices.filter(function (e) { return records[e.id]; });
      const muscles = MUSCLES.filter(function (m) {
        return avecRecord.some(function (e) { return e.muscle === m; });
      });
      ["Tous"].concat(muscles).forEach(function (m) {
        const bouton = el("button", "chip", m);
        bouton.type = "button";
        bouton.setAttribute("aria-pressed", m === muscleChoisi ? "true" : "false");
        bouton.addEventListener("click", function () {
          muscleChoisi = m;
          afficherChips();
          afficherListe();
        });
        zone.appendChild(bouton);
      });
    }

    function afficherListe() {
      const zone = $("liste");
      zone.innerHTML = "";

      const mots = normaliser($("recherche").value).split(" ").filter(Boolean);

      const visibles = exercices.filter(function (e) {
        if (!records[e.id]) return false;
        if (muscleChoisi !== "Tous" && e.muscle !== muscleChoisi) return false;
        const texte = normaliser(e.nom + " " + e.muscle);
        return mots.every(function (m) { return texte.indexOf(m) !== -1; });
      }).sort(function (a, b) {
        return MUSCLES.indexOf(a.muscle) - MUSCLES.indexOf(b.muscle) ||
               a.nom.localeCompare(b.nom, "fr");
      });

      if (visibles.length === 0) {
        zone.appendChild(el("div", "vide", Object.keys(records).length
          ? "Aucun record ne correspond."
          : "Enregistre des séances avec des exercices : tes meilleures séries apparaîtront ici."));
        return;
      }

      const carte = el("div", "card serie-liste");
      visibles.forEach(function (ex) {
        const r = records[ex.id];
        const ligne = el("div", "serie-ligne");
        ligne.appendChild(creerVignette(ex));

        const infos = el("div", "serie-infos");
        infos.appendChild(el("div", "exo-nom-ligne", ex.nom));
        infos.appendChild(el("div", "mut", ex.muscle + " · " + r.nb_seances + " séance" + (r.nb_seances > 1 ? "s" : "")));
        ligne.appendChild(infos);

        const chiffres = el("div", "serie-chiffres");
        if (Number(r.charge_max) > 0) {
          chiffres.appendChild(el("strong", "", nb(r.charge_max) + " kg × " + r.charge_reps));
          chiffres.appendChild(el("span", "", "1RM est. " + nb(r.rm_max) + " kg"));
        } else {
          chiffres.appendChild(el("strong", "", r.reps_max + " reps"));
          chiffres.appendChild(el("span", "", dateFr(r.reps_date)));
        }
        ligne.appendChild(chiffres);
        carte.appendChild(ligne);
      });
      zone.appendChild(carte);
    }

    $("recherche").addEventListener("input", afficherListe);

    /* ---------- Démarrage ---------- */

    (async function () {
      const user = await exigerConnexion();
      if (!user) return;
      try {
        const resultats = await Promise.all([chargerExercices(), chargerRecords()]);
        exercices = resultats[0];
        resultats[1].forEach(function (r) { records[r.exercice_id] = r; });
        remplirExercices();
        afficherChips();
        afficherListe();
      } catch (e) {
        alert("Erreur de chargement : " + e.message);
      }
      await chargerPRsEtAfficher();
      if (location.hash === "#nouveau") ouvrirFormulaire();
    })();
  </script>
</body>
</html>
