<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SportApp – Paramètres</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#090d13">
  <script src="../JS/theme.js"></script>
  <link rel="apple-touch-icon" href="../Image/icon-180.png">
  <link rel="stylesheet" href="../CSS/Couleur.css">
  <link rel="stylesheet" href="../CSS/Commun.css">
  <link rel="stylesheet" href="../CSS/Parametres.css">
</head>
<body>
  <header class="bandeau" id="entete"></header>
  <script src="../JS/entete.js"></script>

  <main>

    <!-- Profil -->
    <section class="card">
      <h2>Profil</h2>

      <div class="row">
        <div>
          <label for="prenom">Prénom</label>
          <input id="prenom" type="text" autocomplete="given-name">
        </div>
        <div>
          <label for="nom">Nom</label>
          <input id="nom" type="text" autocomplete="family-name">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="naissance">Date de naissance</label>
          <input id="naissance" type="date">
        </div>
        <div>
          <label for="poids">Poids actuel (kg)</label>
          <input id="poids" type="number" step="0.1" min="0" inputmode="decimal">
        </div>
      </div>
    </section>

    <!-- Programme de la semaine -->
    <section class="card">
      <h2>Programme de la semaine</h2>
      <p class="mut">Choisis la séance prévue pour chaque jour. Elle s’affichera sur la page d’accueil.</p>
      <div class="row" id="programme"></div>
    </section>

    <div class="actions">
      <button class="btn" id="btn-enregistrer">Enregistrer les paramètres</button>
      <span id="message"></span>
    </div>

    <!-- Apparence -->
    <section class="card">
      <h2>Apparence</h2>
      <div class="onglets trois" id="choix-theme">
        <button type="button" class="onglet" data-choix="auto" aria-pressed="false">Auto</button>
        <button type="button" class="onglet" data-choix="clair" aria-pressed="false">Clair</button>
        <button type="button" class="onglet" data-choix="sombre" aria-pressed="false">Sombre</button>
      </div>
      <p class="mut aide-theme">« Auto » suit le réglage de ton téléphone ou de ton ordinateur. Ce choix est mémorisé sur cet appareil.</p>
    </section>

    <!-- Compte -->
    <section class="card compte">
      <h2>Compte</h2>
      <p class="mut" id="email-compte"></p>
      <button class="btn secondaire" id="btn-deconnexion" type="button">Se déconnecter</button>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../JS/supabase.js"></script>
  <script src="../JS/donnees.js"></script>
  <script>
    const JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
    const TYPES = ["Push", "Pull", "Leg", "Repos"];
    let profilCharge = null;

    // Construit un menu déroulant par jour de la semaine
    function construireProgramme(programme) {
      const zone = document.getElementById("programme");
      zone.innerHTML = "";
      JOURS.forEach(function (jour, i) {
        const bloc = document.createElement("div");

        const label = document.createElement("label");
        label.setAttribute("for", "jour" + i);
        label.textContent = jour;

        const select = document.createElement("select");
        select.id = "jour" + i;
        TYPES.forEach(function (type) {
          const option = document.createElement("option");
          option.textContent = type;
          if (programme[i] === type) option.selected = true;
          select.appendChild(option);
        });

        bloc.appendChild(label);
        bloc.appendChild(select);
        zone.appendChild(bloc);
      });
    }

    async function remplir() {
      profilCharge = await chargerProfil();
      document.getElementById("prenom").value = profilCharge.prenom;
      document.getElementById("nom").value = profilCharge.nom;
      document.getElementById("naissance").value = profilCharge.naissance;
      document.getElementById("poids").value = profilCharge.poids;
      construireProgramme(profilCharge.programme);
    }

    document.getElementById("btn-deconnexion").addEventListener("click", deconnexion);

    document.getElementById("btn-enregistrer").addEventListener("click", async function () {
      const poidsSaisi = document.getElementById("poids").value.replace(",", ".");
      const profil = {
        prenom: document.getElementById("prenom").value.trim(),
        nom: document.getElementById("nom").value.trim(),
        naissance: document.getElementById("naissance").value,
        poids: poidsSaisi,
        programme: JOURS.map(function (_, i) {
          return document.getElementById("jour" + i).value;
        })
      };

      try {
        await sauverProfil(profil);

        // Si le poids a changé, on l'ajoute aussi à l'historique de poids
        const nouveau = parseFloat(poidsSaisi);
        if (!isNaN(nouveau) && nouveau !== parseFloat(profilCharge.poids)) {
          await ajouterPoids(nouveau);
        }
        profilCharge = profil;
        document.getElementById("message").textContent = "Paramètres enregistrés";
      } catch (e) {
        alert("Erreur : " + e.message);
      }
    });

 // Apparence : automatique, clair ou sombre
    function marquerTheme() {
      const actuel = window.themeSportApp.lire();
      document.querySelectorAll("#choix-theme .onglet").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.choix === actuel));
      });
    }

    document.querySelectorAll("#choix-theme .onglet").forEach(function (b) {
      b.addEventListener("click", function () {
        window.themeSportApp.choisir(b.dataset.choix);
        marquerTheme();
      });
    });
    marquerTheme();


    (async function () {
      const user = await exigerConnexion();
      if (!user) return;
      document.getElementById("email-compte").textContent = "Connecté avec " + user.email;
      try {
        await remplir();
      } catch (e) {
        alert("Erreur de chargement : " + e.message);
      }
    })();
  </script>
</body>
</html>
