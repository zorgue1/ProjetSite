<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SportApp – Paramètres</title>
  <link rel="stylesheet" href="../CSS/Parametres.css">
</head>
<body>
  <main>

    <nav>
      <a href="Accueil.html">Accueil</a>
      <a href="Activite.html">Activité</a>
      <a href="Rapport.html">Rapport</a>
      <a href="Parametres.html" class="actif">Paramètres</a>
    </nav>

    <!-- Profil -->
    <section class="card">
      <h2>Profil</h2>

      <div class="row">
        <div>
          <label for="prenom">Prénom</label>
          <input id="prenom" type="text" autocomplete="given-name">
        </div>
        <div>
          <label for="nom">Nom</label>
          <input id="nom" type="text" autocomplete="family-name">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="naissance">Date de naissance</label>
          <input id="naissance" type="date">
        </div>
        <div>
          <label for="poids">Poids actuel (kg)</label>
          <input id="poids" type="number" step="0.1" min="0">
        </div>
      </div>
    </section>

    <!-- Programme de la semaine -->
    <section class="card">
      <h2>Programme de la semaine</h2>
      <p class="mut">Choisis la séance prévue pour chaque jour. Elle s’affichera sur la page d’accueil.</p>
      <div class="row" id="programme"></div>
    </section>

    <div class="actions">
      <button class="btn" id="btn-enregistrer">Enregistrer les paramètres</button>
      <span id="message"></span>
    </div>

  </main>

  <script>
    const CLE = "sportapp:v1";
    const JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
    const TYPES = ["Push", "Pull", "Leg", "Repos"];

    function charger() {
      const defaut = {
        profil: { nom: "", prenom: "", naissance: "", poids: "" },
        programme: ["Push", "Pull", "Leg", "Push", "Pull", "Repos", "Repos"],
        seances: [],
        poids: []
      };
      try {
        const brut = localStorage.getItem(CLE);
        if (brut) return Object.assign(defaut, JSON.parse(brut));
      } catch (e) {}
      return defaut;
    }

    function sauver(donnees) {
      try { localStorage.setItem(CLE, JSON.stringify(donnees)); } catch (e) {}
    }

    function aujourdhui() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }

    // Construit un menu déroulant par jour de la semaine
    function construireProgramme(programme) {
      const zone = document.getElementById("programme");
      JOURS.forEach(function (jour, i) {
        const bloc = document.createElement("div");

        const label = document.createElement("label");
        label.setAttribute("for", "jour" + i);
        label.textContent = jour;

        const select = document.createElement("select");
        select.id = "jour" + i;
        TYPES.forEach(function (type) {
          const option = document.createElement("option");
          option.textContent = type;
          if (programme[i] === type) option.selected = true;
          select.appendChild(option);
        });

        bloc.appendChild(label);
        bloc.appendChild(select);
        zone.appendChild(bloc);
      });
    }

    function remplir() {
      const S = charger();
      document.getElementById("prenom").value = S.profil.prenom;
      document.getElementById("nom").value = S.profil.nom;
      document.getElementById("naissance").value = S.profil.naissance;
      document.getElementById("poids").value = S.profil.poids;
      construireProgramme(S.programme);
    }

    document.getElementById("btn-enregistrer").addEventListener("click", function () {
      const S = charger();
      const ancienPoids = S.profil.poids;
      const nouveauPoids = document.getElementById("poids").value.replace(",", ".");

      S.profil = {
        prenom: document.getElementById("prenom").value.trim(),
        nom: document.getElementById("nom").value.trim(),
        naissance: document.getElementById("naissance").value,
        poids: nouveauPoids
      };

      // Si le poids a changé, on le garde aussi dans l'historique
      if (nouveauPoids && nouveauPoids !== ancienPoids) {
        S.poids.push({ date: aujourdhui(), valeur: parseFloat(nouveauPoids) });
      }

      S.programme = JOURS.map(function (_, i) {
        return document.getElementById("jour" + i).value;
      });

      sauver(S);
      document.getElementById("message").textContent = "Paramètres enregistrés";
    });

    remplir();
  </script>
</body>
</html>
