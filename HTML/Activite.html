<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SportApp – Séances</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#090d13">
  <link rel="apple-touch-icon" href="../Image/icon-180.png">
  <script src="../JS/theme.js"></script>
  <link rel="stylesheet" href="../CSS/Couleur.css">
  <link rel="stylesheet" href="../CSS/Commun.css">
  <link rel="stylesheet" href="../CSS/Activite.css">
</head>
<body>
  <header class="bandeau" id="entete"></header>
  <script src="../JS/entete.js"></script>

  <main>

    <div class="entete-page">
      <h2>Séances</h2>
      <button class="btn" id="btn-nouvelle" type="button">+ Nouvelle séance</button>
    </div>

    <p class="confirmation" id="confirmation" role="status" hidden></p>

    <!-- Formulaire : nouvelle séance ou modification d'une séance -->
    <section class="card" id="formulaire" hidden>
      <h2 id="titre-formulaire">Nouvelle séance</h2>

      <label for="date">Date</label>
      <input id="date" type="date">

      <label for="type">Type de séance</label>
      <div class="chips" id="chips-type"></div>
      <input id="type" list="suggestions" placeholder="Ou écris ta séance (hand, natation…)">
      <datalist id="suggestions">
        <option value="Push">
        <option value="Pull">
        <option value="Leg">
        <option value="Bras et triceps">
        <option value="Épaules">
        <option value="Abdos">
        <option value="Cardio">
      </datalist>

      <label id="label-exercices">Exercices</label>
      <div id="blocs" role="group" aria-labelledby="label-exercices"></div>

      <button class="btn secondaire ajout-exo" id="btn-ajout-exo" type="button">+ Ajouter un exercice</button>

      <div class="picker-panneau" id="picker-panneau" hidden>
        <input id="recherche-exo" type="search" placeholder="Rechercher un exercice…" autocomplete="off">
        <div class="chips" id="chips-muscle"></div>
        <div class="resultats" id="resultats"></div>
      </div>
      <p class="mut" id="aide-exo" hidden>
        Ta bibliothèque est vide. <a href="Exercices.html">Ajoute des exercices</a> pour les saisir ici.
      </p>

      <label for="notes">Notes (ressenti, remarques)</label>
      <textarea id="notes" rows="3"></textarea>

      <div class="actions">
        <button class="btn" id="btn-ajouter" type="button">Enregistrer la séance</button>
        <button class="btn secondaire" id="btn-annuler" type="button">Annuler</button>
      </div>
    </section>

    <!-- Bilan -->
    <section class="bilan" id="bilan"></section>

    <!-- Historique -->
    <div class="chips" id="filtres-historique"></div>
    <section id="historique"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../JS/supabase.js"></script>
  <script src="../JS/donnees.js"></script>
  <script>
    let exercices = [];          // bibliothèque d'exercices
    let blocs = [];              // exercices de la séance : { exercice, series: [{ rep, charge }], indice, ouvert }
    let seances = [];            // toutes les séances
    let filtre = "Tous";         // filtre de l'historique
    let limite = 30;             // nombre de séances affichées
    let rechercheMuscle = "Tous";
    let programme = PROGRAMME_DEFAUT;

    // Vrai si une séance a été commencée sans être enregistrée (brouillon de la page Séances)
    async function seanceEnCours() {
      try {
        const r = await client.auth.getSession();
        if (!r.data.session) return false;
        const brut = localStorage.getItem("sportapp:brouillon:" + r.data.session.user.id);
        const b = JSON.parse(brut || "null");
        return !!(b && ((b.blocs && b.blocs.length) || b.notes));
      } catch (e) {
        return false;
      }
    }
    let moiId = null;            // identifiant de l'utilisateur connecté
    let editionId = null;        // séance en cours de modification (null = nouvelle séance)
    const FILTRES = ["Tous", "Push", "Pull", "Leg", "Autres"];

    function dateCourte(texte) {
      return new Date(texte + "T12:00:00").toLocaleDateString("fr-FR", {
        day: "2-digit", month: "2-digit"
      });
    }

    // Date au format AAAA-MM-JJ (heure locale)
    function versTexte(date) {
      const d = new Date(date.getTime());
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }

    // Crée un élément HTML (le texte est inséré en toute sécurité)
    function el(balise, classe, texte) {
      const e = document.createElement(balise);
      if (classe) e.className = classe;
      if (texte) e.textContent = texte;
      return e;
    }

    function champNombre(placeholder, valeur, mode, pas) {
      const c = document.createElement("input");
      c.type = "number";
      c.min = "0";
      c.step = pas;
      c.inputMode = mode;
      c.placeholder = placeholder;
      c.setAttribute("aria-label", placeholder);
      c.value = valeur;
      return c;
    }

    // Rangement d'une séance : Push, Pull, Leg ou Autres
    function categorie(type) {
      const t = type.trim().toLowerCase();
      if (t.startsWith("push")) return "Push";
      if (t.startsWith("pull")) return "Pull";
      if (t.startsWith("leg")) return "Leg";
      return "Autres";
    }

    function confirmer(texte) {
      const c = document.getElementById("confirmation");
      c.textContent = texte;
      c.hidden = false;
      setTimeout(function () { c.hidden = true; }, 3500);
    }

    /* ---------- Brouillon : la séance en cours est gardée sur cet appareil ---------- */

    function cleBrouillon() {
      return "sportapp:brouillon:" + moiId;
    }

    function effacerBrouillon() {
      try { localStorage.removeItem(cleBrouillon()); } catch (e) {}
    }

    function lireBrouillon() {
      try {
        const brut = localStorage.getItem(cleBrouillon());
        return brut ? JSON.parse(brut) : null;
      } catch (e) {
        return null;
      }
    }

    // Enregistre l'état de la séance à chaque changement (pas pour une modification)
    function sauverBrouillon() {
      if (editionId !== null || !moiId) return;
      const notes = document.getElementById("notes").value;

      if (blocs.length === 0 && notes.trim() === "") {
        effacerBrouillon();
        return;
      }

      const contenu = {
        date: document.getElementById("date").value,
        type: document.getElementById("type").value,
        notes: notes,
        blocs: blocs.map(function (b) {
          return {
            exercice: {
              id: b.exercice.id, nom: b.exercice.nom, image_url: b.exercice.image_url,
              muscle: b.exercice.muscle, groupe: b.exercice.groupe
            },
            series: b.series,
            ouvert: b.ouvert
          };
        })
      };
      try { localStorage.setItem(cleBrouillon(), JSON.stringify(contenu)); } catch (e) {}
    }

    // Reprend la séance commencée avant de quitter la page
    function restaurerBrouillon() {
      const b = lireBrouillon();
      if (!b || !((b.blocs && b.blocs.length) || b.notes)) return false;

      editionId = null;
      majTitres();
      document.getElementById("formulaire").hidden = false;
      document.getElementById("btn-nouvelle").hidden = true;
      document.getElementById("date").value = b.date || aujourdhui();
      document.getElementById("type").value = b.type || "";
      document.getElementById("notes").value = b.notes || "";

      blocs = (b.blocs || []).map(function (x) {
        const biblio = exercices.find(function (e) { return e.id === x.exercice.id; }) || x.exercice;
        return {
          exercice: biblio,
          series: x.series && x.series.length ? x.series : [{ rep: "", charge: "" }],
          indice: null,
          ouvert: !!x.ouvert
        };
      });

      afficherChipsType();
      afficherBlocs();
      afficherResultats();
      blocs.forEach(chargerIndice);
      confirmer("Séance en cours reprise");
      return true;
    }

    /* ---------- Pastilles du type de séance ---------- */

    // Push, Pull, Leg et ce qui est écrit dans ton programme (hand, natation…)
    function typesProposes() {
      const liste = ["Push", "Pull", "Leg"];
      programme.forEach(function (p) {
        const dejaLa = liste.some(function (t) { return normaliser(t) === normaliser(p); });
        if (!estRepos(p) && !dejaLa) liste.push(p);
      });
      return liste;
    }

    function afficherChipsType() {
      const zone = document.getElementById("chips-type");
      const champ = document.getElementById("type");
      zone.innerHTML = "";

      const actuel = normaliser(champ.value);
      const types = typesProposes();
      const connu = types.some(function (t) { return normaliser(t) === actuel; });

      types.forEach(function (t) {
        const bouton = el("button", "chip", t);
        bouton.type = "button";
        bouton.setAttribute("aria-pressed", normaliser(t) === actuel ? "true" : "false");
        bouton.addEventListener("click", function () {
          champ.value = t;
          afficherChipsType();
          sauverBrouillon();
        });
        zone.appendChild(bouton);
      });

      // « Autre… » : on écrit sa propre séance dans le champ
      const autre = el("button", "chip", "Autre…");
      autre.type = "button";
      autre.setAttribute("aria-pressed", actuel !== "" && !connu ? "true" : "false");
      autre.addEventListener("click", function () {
        champ.value = "";
        afficherChipsType();
        champ.focus();
      });
      zone.appendChild(autre);
    }

    /* ---------- Formulaire : nouvelle séance, modification, fermeture ---------- */

    function majTitres() {
      const edition = editionId !== null;
      document.getElementById("titre-formulaire").textContent = edition ? "Modifier la séance" : "Nouvelle séance";
      document.getElementById("btn-ajouter").textContent = edition ? "Enregistrer les modifications" : "Enregistrer la séance";
    }

    function ouvrirNouvelle() {
      editionId = null;
      majTitres();
      document.getElementById("formulaire").hidden = false;
      document.getElementById("btn-nouvelle").hidden = true;
      document.getElementById("date").value = aujourdhui();
      document.getElementById("notes").value = "";
      blocs = [];

      // La séance prévue aujourd'hui est proposée d'office (tu peux la changer)
      const prevu = programme[(new Date().getDay() + 6) % 7];
      document.getElementById("type").value = estRepos(prevu) ? "" : prevu;

      fermerPanneau();
      afficherChipsType();
      afficherBlocs();
      afficherResultats();
      document.getElementById("formulaire").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // Peut-on ouvrir une modification sans écraser une séance en cours de saisie ?
    function peutEditer() {
      if (document.getElementById("formulaire").hidden) return true;
      if (editionId !== null) return confirm("Abandonner les modifications en cours ?");
      if (blocs.length > 0 || document.getElementById("notes").value.trim() !== "") {
        alert("Termine ou annule d’abord la séance en cours.");
        return false;
      }
      return true;
    }

    // Rouvre une séance enregistrée dans le formulaire, déjà remplie
    function ouvrirEdition(s, exos) {
      if (!peutEditer()) return;

      editionId = s.id;
      majTitres();
      document.getElementById("formulaire").hidden = false;
      document.getElementById("btn-nouvelle").hidden = true;
      document.getElementById("date").value = s.date;
      document.getElementById("type").value = s.type;
      document.getElementById("notes").value = s.notes || "";

      blocs = exos.map(function (ex) {
        const biblio = exercices.find(function (e) { return e.id === ex.exercice_id; }) ||
          { id: ex.exercice_id, nom: ex.nom, image_url: ex.image_url, muscle: "", groupe: "" };
        return {
          exercice: biblio,
          series: ex.series.map(function (x) {
            return { rep: String(x.repetitions), charge: x.charge > 0 ? String(x.charge) : "" };
          }),
          indice: null,
          ouvert: false
        };
      });

      fermerPanneau();
      afficherChipsType();
      afficherBlocs();
      afficherResultats();
      document.getElementById("formulaire").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function fermerFormulaire() {
      editionId = null;
      document.getElementById("formulaire").hidden = true;
      document.getElementById("btn-nouvelle").hidden = false;
      document.getElementById("type").value = "";
      document.getElementById("notes").value = "";
      document.getElementById("recherche-exo").value = "";
      blocs = [];
      fermerPanneau();
      afficherBlocs();
      afficherResultats();
      effacerBrouillon();
    }

    /* ---------- Recherche et choix des exercices ---------- */

    function afficherChoix() {
      const vide = exercices.length === 0;
      document.getElementById("aide-exo").hidden = !vide;
      document.getElementById("btn-ajout-exo").hidden = vide;
      if (vide) {
        fermerPanneau();
        return;
      }
      afficherChipsMuscle();
      afficherResultats();
    }

    function ouvrirPanneau() {
      document.getElementById("picker-panneau").hidden = false;
      document.getElementById("btn-ajout-exo").textContent = "Fermer la liste";
      document.getElementById("recherche-exo").focus();
    }

    function fermerPanneau() {
      document.getElementById("picker-panneau").hidden = true;
      document.getElementById("btn-ajout-exo").textContent = "+ Ajouter un exercice";
    }

    document.getElementById("btn-ajout-exo").addEventListener("click", function () {
      if (document.getElementById("picker-panneau").hidden) ouvrirPanneau();
      else fermerPanneau();
    });

    // Pastilles : seulement les muscles qui ont au moins un exercice
    function afficherChipsMuscle() {
      const zone = document.getElementById("chips-muscle");
      zone.innerHTML = "";
      const muscles = MUSCLES.filter(function (m) {
        return exercices.some(function (e) { return e.muscle === m; });
      });
      ["Tous"].concat(muscles).forEach(function (m) {
        const bouton = el("button", "chip", m);
        bouton.type = "button";
        bouton.setAttribute("aria-pressed", m === rechercheMuscle ? "true" : "false");
        bouton.addEventListener("click", function () {
          rechercheMuscle = m;
          afficherChipsMuscle();
          afficherResultats();
        });
        zone.appendChild(bouton);
      });
    }

    function afficherResultats() {
      const zone = document.getElementById("resultats");
      const haut = zone.scrollTop;
      zone.innerHTML = "";

      const mots = normaliser(document.getElementById("recherche-exo").value)
        .split(" ").filter(Boolean);

      const trouves = exercices.filter(function (e) {
        if (rechercheMuscle !== "Tous" && e.muscle !== rechercheMuscle) return false;
        const texte = normaliser(e.nom + " " + e.muscle + " " + e.groupe);
        return mots.every(function (m) { return texte.indexOf(m) !== -1; });
      }).sort(function (a, b) {
        return MUSCLES.indexOf(a.muscle) - MUSCLES.indexOf(b.muscle) ||
               a.nom.localeCompare(b.nom, "fr");
      });

      if (trouves.length === 0) {
        zone.appendChild(el("div", "aucun", "Aucun exercice trouvé."));
        return;
      }

      let muscleCourant = null;
      trouves.forEach(function (ex) {
        // Titre de section quand on parcourt toute la liste sans recherche
        if (mots.length === 0 && ex.muscle !== muscleCourant) {
          muscleCourant = ex.muscle;
          zone.appendChild(el("div", "resultat-titre", ex.muscle));
        }

        const deja = blocs.some(function (b) { return b.exercice.id === ex.id; });
        const ligne = el("button", "resultat");
        ligne.type = "button";
        ligne.disabled = deja;
        ligne.appendChild(creerVignette(ex));

        const texte = el("div", "resultat-texte");
        texte.appendChild(el("div", "exo-nom-ligne", ex.nom));
        texte.appendChild(el("div", "mut", ex.muscle + " · " + ex.groupe));
        ligne.appendChild(texte);

        ligne.appendChild(el("span", "resultat-action", deja ? "Ajouté ✓" : "+ Ajouter"));
        ligne.addEventListener("click", function () { ajouterBloc(ex); });
        zone.appendChild(ligne);
      });
      zone.scrollTop = haut;
    }

    // Ce qui avait été fait la dernière fois (pas pour une modification de séance)
    async function chargerIndice(bloc) {
      if (editionId !== null) return;
      try {
        bloc.indice = await chargerDerniereFois(bloc.exercice.id);
        if (!bloc.indice || blocs.indexOf(bloc) === -1) return;
        // On ne reconstruit pas la liste si tu es en train de saisir un chiffre
        if (document.getElementById("blocs").contains(document.activeElement)) return;
        afficherBlocs();
      } catch (e) {}
    }

    function ajouterBloc(exercice) {
      if (blocs.some(function (b) { return b.exercice.id === exercice.id; })) return;

      // Les exercices précédents se replient, le nouveau s'ouvre
      blocs.forEach(function (b) { b.ouvert = false; });
      const bloc = { exercice: exercice, series: [{ rep: "", charge: "" }], indice: null, ouvert: true };
      blocs.push(bloc);

      document.getElementById("recherche-exo").value = "";
      fermerPanneau();
      afficherBlocs();
      afficherResultats();

      const cartes = document.querySelectorAll(".bloc-exo");
      cartes[cartes.length - 1].scrollIntoView({ behavior: "smooth", block: "nearest" });
      chargerIndice(bloc);
    }

    document.getElementById("recherche-exo").addEventListener("input", afficherResultats);

    // Entrée : ajoute le premier résultat
    document.getElementById("recherche-exo").addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const premier = document.querySelector("#resultats .resultat:not(:disabled)");
      if (premier) premier.click();
    });

    /* ---------- Exercices de la séance (liste repliable) ---------- */

    function seriesValides(bloc) {
      return bloc.series.filter(function (s) { return parseInt(s.rep, 10) > 0; });
    }

    // Résumé affiché quand l'exercice est replié
    function resumeBloc(bloc) {
      const valides = seriesValides(bloc);
      if (valides.length === 0) return "Aucune série saisie";

      function texte(s) {
        return texteSerie({
          repetitions: parseInt(s.rep, 10),
          charge: parseFloat(String(s.charge).replace(",", ".")) || 0
        });
      }
      const premiere = texte(valides[0]);
      const derniere = texte(valides[valides.length - 1]);
      return valides.length + " série" + (valides.length > 1 ? "s" : "") + " · " +
        (premiere === derniere ? premiere : premiere + " → " + derniere);
    }

    function afficherBlocs() {
      const zone = document.getElementById("blocs");
      zone.innerHTML = "";

      if (blocs.length === 0) {
        zone.appendChild(el("p", "mut aucun-exo", "Aucun exercice ajouté pour l’instant."));
      }

      blocs.forEach(function (bloc, i) {
        const carte = el("div", "bloc-exo" + (bloc.ouvert ? " ouvert" : ""));

        // Ligne repliable : photo, nom, résumé
        const tete = el("div", "bloc-tete");
        const bascule = el("button", "bloc-bascule");
        bascule.type = "button";
        bascule.setAttribute("aria-expanded", String(bloc.ouvert));
        bascule.appendChild(creerVignette(bloc.exercice));

        const texte = el("span", "bloc-texte");
        texte.appendChild(el("span", "exo-nom-ligne", bloc.exercice.nom));
        const resume = el("span", "bloc-resume", resumeBloc(bloc));
        texte.appendChild(resume);
        bascule.appendChild(texte);
        bascule.appendChild(el("span", "chevron", "›"));
        bascule.addEventListener("click", function () {
          bloc.ouvert = !bloc.ouvert;
          afficherBlocs();
        });
        tete.appendChild(bascule);

        const retirer = el("button", "btn-mini", "✕");
        retirer.type = "button";
        retirer.setAttribute("aria-label", "Retirer " + bloc.exercice.nom + " de la séance");
        retirer.addEventListener("click", function () {
          if (seriesValides(bloc).length > 0 && !confirm("Retirer « " + bloc.exercice.nom + " » de la séance ?")) return;
          blocs.splice(i, 1);
          afficherBlocs();
          afficherResultats();
        });
        tete.appendChild(retirer);
        carte.appendChild(tete);

        // Détail : visible seulement quand l'exercice est ouvert
        if (bloc.ouvert) {
          const corps = el("div", "bloc-corps");

          if (bloc.indice) {
            const indice = el("div", "indice");
            indice.appendChild(el("span", null,
              "Dernière fois (" + dateCourte(bloc.indice.date) + ") : " +
              bloc.indice.series.map(texteSerie).join(" · ")));
            const reprendre = el("button", "btn-suppr", "Reprendre");
            reprendre.type = "button";
            reprendre.addEventListener("click", function () {
              bloc.series = bloc.indice.series.map(function (s) {
                return { rep: String(s.repetitions), charge: s.charge > 0 ? String(s.charge) : "" };
              });
              afficherBlocs();
            });
            indice.appendChild(reprendre);
            corps.appendChild(indice);
          }

          bloc.series.forEach(function (serie, j) {
            const ligne = el("div", "ligne-serie");
            ligne.appendChild(el("span", "num-serie", String(j + 1)));

            const rep = champNombre("Reps", serie.rep, "numeric", "1");
            rep.addEventListener("input", function () {
              serie.rep = rep.value;
              resume.textContent = resumeBloc(bloc);
              sauverBrouillon();
            });
            ligne.appendChild(rep);

            ligne.appendChild(el("span", "croix", "×"));

            const charge = champNombre("kg", serie.charge, "decimal", "0.5");
            charge.addEventListener("input", function () {
              serie.charge = charge.value;
              resume.textContent = resumeBloc(bloc);
              sauverBrouillon();
            });
            ligne.appendChild(charge);

            const supprimer = el("button", "btn-mini", "✕");
            supprimer.type = "button";
            supprimer.setAttribute("aria-label", "Supprimer la série " + (j + 1));
            supprimer.addEventListener("click", function () {
              bloc.series.splice(j, 1);
              if (bloc.series.length === 0) bloc.series.push({ rep: "", charge: "" });
              afficherBlocs();
            });
            ligne.appendChild(supprimer);

            corps.appendChild(ligne);
          });

          // Ajouter une série (copie les valeurs de la précédente)
          const ajout = el("button", "btn-suppr", "+ Série");
          ajout.type = "button";
          ajout.addEventListener("click", function () {
            const derniere = bloc.series[bloc.series.length - 1];
            bloc.series.push({ rep: derniere.rep, charge: derniere.charge });
            afficherBlocs();
            const champs = document.querySelectorAll(".bloc-exo")[i].querySelectorAll(".ligne-serie input");
            champs[champs.length - 2].focus();
          });
          corps.appendChild(ajout);

          carte.appendChild(corps);
        }

        zone.appendChild(carte);
      });

      sauverBrouillon();
    }

    /* ---------- Bilan et filtres ---------- */

    function afficherBilan() {
      const zone = document.getElementById("bilan");
      zone.innerHTML = "";

      const lundi = new Date();
      lundi.setHours(12, 0, 0, 0);
      lundi.setDate(lundi.getDate() - ((lundi.getDay() + 6) % 7));
      const lundiTexte = versTexte(lundi);
      const aujourdhuiTexte = aujourdhui();
      const mois = aujourdhuiTexte.slice(0, 7);

      const semaine = seances.filter(function (s) {
        return s.date >= lundiTexte && s.date <= aujourdhuiTexte;
      }).length;
      const ceMois = seances.filter(function (s) { return s.date.slice(0, 7) === mois; }).length;

      [["Cette semaine", semaine], ["Ce mois-ci", ceMois], ["Au total", seances.length]].forEach(function (b) {
        const carte = el("div", "mini-bilan");
        carte.appendChild(el("div", "t", b[0]));
        carte.appendChild(el("div", "v", String(b[1])));
        zone.appendChild(carte);
      });
    }

    function afficherFiltres() {
      const zone = document.getElementById("filtres-historique");
      zone.innerHTML = "";
      FILTRES.forEach(function (f) {
        const nb = f === "Tous"
          ? seances.length
          : seances.filter(function (s) { return categorie(s.type) === f; }).length;
        const bouton = el("button", "chip", f + " · " + nb);
        bouton.type = "button";
        bouton.setAttribute("aria-pressed", f === filtre ? "true" : "false");
        bouton.addEventListener("click", function () {
          filtre = f;
          limite = 30;
          afficherFiltres();
          afficherHistorique(false);
        });
        zone.appendChild(bouton);
      });
    }

    /* ---------- Historique rangé par mois ---------- */

    // recharger = false : on réutilise les séances déjà chargées (simple changement de filtre)
    async function afficherHistorique(recharger) {
      if (recharger !== false) {
        seances = await chargerSeances();
        afficherBilan();
        afficherFiltres();
      }

      const zone = document.getElementById("historique");
      zone.innerHTML = "";

      const filtrees = seances.filter(function (s) {
        return filtre === "Tous" || categorie(s.type) === filtre;
      });

      if (filtrees.length === 0) {
        zone.appendChild(el("div", "vide", seances.length
          ? "Aucune séance dans cette catégorie."
          : "Aucune séance enregistrée. Touche « Nouvelle séance » après ton entraînement."));
        return;
      }

      const visibles = filtrees.slice(0, limite);
      const parSeance = grouperSeries(await chargerSeries(visibles.map(function (s) { return s.id; })));

      let moisCourant = null;
      visibles.forEach(function (s) {
        const cle = s.date.slice(0, 7);
        const d = new Date(s.date + "T12:00:00");

        // Titre du mois
        if (cle !== moisCourant) {
          moisCourant = cle;
          const nomMois = d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
          const titre = el("h3", "mois", nomMois.charAt(0).toUpperCase() + nomMois.slice(1));
          const nb = filtrees.filter(function (x) { return x.date.slice(0, 7) === cle; }).length;
          titre.appendChild(el("span", "compte", String(nb)));
          zone.appendChild(titre);
        }

        // Ligne compacte qui s'ouvre au clic
        const exos = parSeance[s.id] || [];
        const nbSeries = exos.reduce(function (a, e) { return a + e.series.length; }, 0);

        const ligne = el("details", "seance-ligne");
        const resume = el("summary");

        const bloc = el("span", "date-bloc");
        bloc.appendChild(el("strong", null, String(d.getDate())));
        bloc.appendChild(el("small", null, d.toLocaleDateString("fr-FR", { weekday: "short" })));
        resume.appendChild(bloc);

        const infos = el("span", "seance-infos");
        infos.appendChild(el("span", "tag " + categorie(s.type).toLowerCase(), s.type));
        infos.appendChild(el("span", "mut", exos.length
          ? exos.length + " exercice" + (exos.length > 1 ? "s" : "") + " · " + nbSeries + " série" + (nbSeries > 1 ? "s" : "")
          : (s.notes ? "Notes uniquement" : "Aucun détail")));
        resume.appendChild(infos);
        resume.appendChild(el("span", "chevron", "›"));
        ligne.appendChild(resume);

        // Détail
        const detail = el("div", "seance-detail");
        exos.forEach(function (ex) { detail.appendChild(creerLigneExercice(ex)); });
        if (s.notes) detail.appendChild(el("div", "notes-seance", s.notes));

        const actions = el("div", "seance-actions");

        const modifier = el("button", "btn-suppr", "Modifier");
        modifier.type = "button";
        modifier.addEventListener("click", function () { ouvrirEdition(s, exos); });
        actions.appendChild(modifier);

        const supprimer = el("button", "btn-suppr", "Supprimer");
        supprimer.type = "button";
        supprimer.addEventListener("click", async function () {
          if (!confirm("Supprimer cette séance ?")) return;
          try {
            await supprimerSeance(s.id);
            await afficherHistorique();
          } catch (e) {
            alert("Erreur : " + e.message);
          }
        });
        actions.appendChild(supprimer);

        detail.appendChild(actions);
        ligne.appendChild(detail);
        zone.appendChild(ligne);
      });

      if (filtrees.length > limite) {
        const plus = el("button", "btn-suppr plus", "Afficher plus de séances");
        plus.addEventListener("click", function () {
          limite += 30;
          afficherHistorique(false);
        });
        zone.appendChild(plus);
      }
    }

    /* ---------- Enregistrement ---------- */

    document.getElementById("btn-nouvelle").addEventListener("click", ouvrirNouvelle);

    document.getElementById("btn-annuler").addEventListener("click", function () {
      const contenu = blocs.length > 0 || document.getElementById("notes").value.trim() !== "";
      const question = editionId !== null
        ? "Annuler les modifications ?"
        : "Abandonner cette séance ? Les exercices saisis seront perdus.";
      if (contenu && !confirm(question)) return;
      fermerFormulaire();
    });

    // Le brouillon suit aussi la date, le type et les notes
    ["date", "type", "notes"].forEach(function (id) {
      document.getElementById(id).addEventListener("input", sauverBrouillon);
    });
    document.getElementById("type").addEventListener("input", afficherChipsType);

    document.getElementById("btn-ajouter").addEventListener("click", async function () {
      const bouton = this;
      const type = document.getElementById("type").value.trim();
      if (!type) {
        document.getElementById("type").focus();
        return;
      }

      // Séries valides : au moins une répétition
      const lignes = [];
      blocs.forEach(function (bloc) {
        let numero = 0;
        bloc.series.forEach(function (s) {
          const rep = parseInt(s.rep, 10);
          if (!rep || rep <= 0) return;
          numero++;
          lignes.push({
            exercice_id: bloc.exercice.id,
            numero: numero,
            repetitions: rep,
            charge: parseFloat(String(s.charge).replace(",", ".")) || 0
          });
        });
      });

      const donnees = {
        date: document.getElementById("date").value || aujourdhui(),
        type: type,
        notes: document.getElementById("notes").value.trim()
      };

      bouton.disabled = true;
      try {
        if (editionId !== null) {
          // Modification d'une séance déjà enregistrée
          await modifierSeance(editionId, donnees);
          await remplacerSeries(editionId, lignes);
          fermerFormulaire();
          confirmer("Séance modifiée");
        } else {
          // Nouvelle séance
          const id = await ajouterSeance(donnees);
          try {
            await ajouterSeries(id, lignes);
          } catch (e) {
            await supprimerSeance(id);   // on n'enregistre pas une séance à moitié
            throw e;
          }
          fermerFormulaire();
          confirmer("Séance enregistrée");
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
        await afficherHistorique();
      } catch (e) {
        alert("Erreur : " + e.message);
      } finally {
        bouton.disabled = false;
      }
    });

    /* ---------- Démarrage ---------- */

    (async function () {
      const user = await exigerConnexion();
      if (!user) return;
      moiId = user.id;
      document.getElementById("date").value = aujourdhui();
      try {
        exercices = await chargerExercices();
        try { programme = (await chargerProfil()).programme; } catch (e) {}
        afficherChoix();
        restaurerBrouillon();          // reprend la séance commencée avant de quitter la page
        await afficherHistorique();
      } catch (e) {
        alert("Erreur de chargement : " + e.message);
      }
    })();
  </script>
</body>
</html>
