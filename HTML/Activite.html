<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://unzyqfkxgfepvzirnmfd.supabase.co wss://unzyqfkxgfepvzirnmfd.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SportApp – Séances</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#090d13">
  <link rel="apple-touch-icon" href="../Image/icon-180.png">
  <script src="../JS/theme.js"></script>
  <link rel="stylesheet" href="../CSS/Couleur.css">
  <link rel="stylesheet" href="../CSS/Commun.css">
  <link rel="stylesheet" href="../CSS/Activite.css">
</head>
<body>
  <header class="bandeau" id="entete"></header>
  <script src="../JS/entete.js"></script>
  <script src="../JS/chrono.js"></script>
  <script src="../JS/tutoriel.js"></script>

  <main>

    <div class="entete-page">
      <h2>Séances</h2>
      <button class="btn" id="btn-nouvelle" type="button">+ Nouvelle séance</button>
    </div>

    <p class="confirmation" id="confirmation" role="status" hidden></p>

    <!-- Formulaire : nouvelle séance ou modification d'une séance -->
    <section class="card" id="formulaire" hidden>
      <h2 id="titre-formulaire">Nouvelle séance</h2>

      <label for="date">Date</label>
      <input id="date" type="date">

      <label for="type">Type de séance</label>
      <div class="chips" id="chips-type"></div>
      <input id="type" list="suggestions" placeholder="Ou écris ta séance (hand, natation…)">
      <datalist id="suggestions">
        <option value="Push">
        <option value="Pull">
        <option value="Leg">
        <option value="Bras et triceps">
        <option value="Épaules">
        <option value="Abdos">
        <option value="Cardio">
      </datalist>

      <!-- Échauffement : facultatif, replié ; il ne compte ni dans les records, ni dans l'XP, ni dans le tonnage -->
      <details class="echauffement" id="echauffement">
        <summary>
          <span class="echauffement-titre">🔥 Échauffement</span>
          <span class="mut" id="echauffement-resume">facultatif</span>
          <span class="chevron" aria-hidden="true">›</span>
        </summary>
        <div class="echauffement-corps">
          <textarea id="echauffement-note" rows="2" maxlength="500" placeholder="Ex. : mobilité des épaules, rotations, élastiques…" aria-label="Note d’échauffement"></textarea>
          <div id="blocs-echauffement" role="group" aria-label="Exercices d’échauffement"></div>
          <button class="btn secondaire ajout-exo" id="btn-ajout-echauffement" type="button">+ Cardio ou séries d’approche</button>
          <p class="mut petit">Ne compte pas dans tes records, ton XP ni ton tonnage.</p>
        </div>
      </details>

      <label id="label-exercices">Exercices</label>
      <div id="blocs" role="group" aria-labelledby="label-exercices"></div>

      <button class="btn secondaire ajout-exo" id="btn-ajout-exo" type="button">+ Ajouter un exercice</button>

      <div class="picker-panneau" id="picker-panneau" hidden>
        <input id="recherche-exo" type="search" placeholder="Rechercher un exercice…" autocomplete="off">
        <div class="chips" id="chips-muscle"></div>
        <div class="resultats" id="resultats"></div>
      </div>
      <p class="mut" id="aide-exo" hidden>
        Ta bibliothèque est vide. <a href="Exercices.html">Ajoute des exercices</a> pour les saisir ici.
      </p>

      <label for="notes">Notes (ressenti, remarques)</label>
      <textarea id="notes" rows="3"></textarea>

      <div class="actions">
        <button class="btn" id="btn-ajouter" type="button">Enregistrer la séance</button>
        <button class="btn secondaire" id="btn-annuler" type="button">Annuler</button>
      </div>
    </section>

    <!-- Séances enregistrées sans réseau, pas encore envoyées -->
    <p class="vide attente" id="attente" hidden></p>

    <!-- Bilan et filtres : repliés sur une ligne pour voir tout de suite l'historique -->
    <details class="replier" id="replier">
      <summary>
        <span class="replier-resume" id="replier-resume">Bilan et filtres</span>
        <span class="replier-action">Filtrer</span>
      </summary>
      <section class="bilan" id="bilan"></section>
      <div class="chips" id="filtres-historique"></div>
    </details>

    <!-- Historique -->
    <section id="historique"><div class="squelette"></div><div class="squelette"></div><div class="squelette"></div></section>

  </main>

  <!-- Nouveau record pendant la séance -->
  <div class="annonce-record" id="annonce-record" role="status" hidden></div>

  <!-- Récap de fin de séance -->
  <div class="recap-fond" id="recap" hidden>
    <div class="recap-carte" role="dialog" aria-modal="true" aria-labelledby="recap-titre">
      <div class="confettis" id="confettis" aria-hidden="true"></div>
      <div class="recap-emoji" aria-hidden="true">💪</div>
      <h2 id="recap-titre">Séance terminée !</h2>
      <p class="mut" id="recap-sous"></p>
      <div class="recap-chiffres" id="recap-chiffres"></div>
      <div class="recap-records" id="recap-records"></div>
      <p class="recap-xp" id="recap-xp"></p>
      <button class="btn" id="recap-ok" type="button">Super !</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js" integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ" crossorigin="anonymous"></script>
  <script src="../JS/supabase.js"></script>
  <script src="../JS/donnees.js"></script>
  <script src="../JS/dessins.js"></script>
  <script>
    let exercices = [];          // bibliothèque d'exercices
    let blocs = [];              // exercices de la séance : { exercice, series: [{ rep, charge }], indice, ouvert }
    let seances = [];            // toutes les séances
    let filtre = "Tous";         // filtre de l'historique
    let rechercheMuscle = "Tous";
    let programme = PROGRAMME_DEFAUT;

    let pourEchauffement = false; // la liste d'exercices a été ouverte depuis l'échauffement
    let moiId = null;            // identifiant de l'utilisateur connecté
    let editionId = null;        // séance en cours de modification (null = nouvelle séance)
    let debutSeance = null;      // heure de début de la séance (pour le récap)
    let xpAvant = null;          // XP avant la séance (pour afficher l'XP gagnée)

    // Petites données gardées sur l'appareil, pour que la page marche aussi sans réseau
    function lireLocal(nom, defaut) {
      try { return JSON.parse(localStorage.getItem("sportapp:" + nom + ":" + moiId)) || defaut; } catch (e) { return defaut; }
    }
    function ecrireLocal(nom, valeur) {
      try { localStorage.setItem("sportapp:" + nom + ":" + moiId, JSON.stringify(valeur)); } catch (e) {}
    }

    function nombre(v) {
      return parseFloat(String(v).replace(",", ".")) || 0;
    }

    const FILTRES = ["Tous", "Push", "Pull", "Leg", "Cardio", "Autres"];

    /* ---------- Cardio : une « série » = durée, distance, vitesse… (textes dans les champs) ---------- */

    function nouvelleSerie(exercice) {
      return estCardio(exercice)
        ? { duree: "", distance: "", vitesse: "", inclinaison: "", resistance: "", calories: "" }
        : { rep: "", charge: "" };
    }

    // Série saisie (textes) → valeurs pour l'affichage et l'enregistrement
    function valeursCardio(s) {
      const v = {
        duree_s: dureeEnSecondes(s.duree),
        distance_km: nombre(s.distance),
        inclinaison: nombre(s.inclinaison),
        resistance: nombre(s.resistance),
        calories: Math.round(nombre(s.calories))
      };
      v.vitesse = nombre(s.vitesse) || (v.distance_km > 0 && v.duree_s > 0 ? Math.round(v.distance_km / (v.duree_s / 3600) * 10) / 10 : 0);
      return v;
    }

    // Série enregistrée (nombres) → champs du formulaire
    function champsDepuisCardio(s) {
      function t(v) { return v > 0 ? String(Math.round(v * 10) / 10) : ""; }
      return {
        duree: s.duree_s > 0 ? texteChampDuree(s.duree_s) : "",
        distance: t(s.distance_km), vitesse: t(s.vitesse), inclinaison: t(s.inclinaison),
        resistance: t(s.resistance), calories: t(s.calories)
      };
    }

    function texteSerieSaisie(bloc, s) {
      return estCardio(bloc.exercice)
        ? texteCardio(valeursCardio(s))
        : texteSerie({ repetitions: parseInt(s.rep, 10) || 0, charge: nombre(s.charge) });
    }

    function dateCourte(texte) {
      return new Date(texte + "T12:00:00").toLocaleDateString("fr-FR", {
        day: "2-digit", month: "2-digit"
      });
    }

    function champNombre(placeholder, valeur, mode, pas) {
      const c = document.createElement("input");
      // Décimaux (kg, km…) : champ texte avec pavé numérique, pour accepter la virgule
      // (sur iPhone, un champ « number » refuse « 22,7 »)
      // Durée : « 24,57 » ou « 24:57 » = 24 min 57 s
      if (mode === "decimal" || mode === "duree") {
        c.type = "text";
        c.autocomplete = "off";
        c.addEventListener("input", function () {
          const propre = c.value.replace(mode === "duree" ? /[^0-9.,:]/g : /[^0-9.,]/g, "").replace(/[.,:](?=.*[.,:])/g, "");
          if (propre !== c.value) c.value = propre;
        });
      } else {
        c.type = "number";
        c.min = "0";
        c.step = pas;
      }
      c.inputMode = mode === "duree" ? "decimal" : mode;
      c.placeholder = placeholder;
      c.setAttribute("aria-label", placeholder);
      c.value = valeur;
      return c;
    }

    // Rangement d'une séance : Push, Pull, Leg ou Autres
    function categorie(type) {
      const t = type.trim().toLowerCase();
      if (t.startsWith("push")) return "Push";
      if (t.startsWith("pull")) return "Pull";
      if (t.startsWith("leg")) return "Leg";
      if (t.startsWith("cardio")) return "Cardio";
      return "Autres";
    }

    /* ---------- Brouillon : la séance en cours est gardée sur cet appareil ---------- */

    function cleBrouillon() {
      return "sportapp:brouillon:" + moiId;
    }

    function effacerBrouillon() {
      try { localStorage.removeItem(cleBrouillon()); } catch (e) {}
    }

    function lireBrouillon() {
      try {
        const brut = localStorage.getItem(cleBrouillon());
        return brut ? JSON.parse(brut) : null;
      } catch (e) {
        return null;
      }
    }

    // Enregistre l'état de la séance à chaque changement (pas pour une modification)
    function sauverBrouillon() {
      if (editionId !== null || !moiId) return;
      const notes = document.getElementById("notes").value;
      const noteEchauffement = document.getElementById("echauffement-note").value;

      if (blocs.length === 0 && notes.trim() === "" && noteEchauffement.trim() === "") {
        effacerBrouillon();
        return;
      }

      const contenu = {
        date: document.getElementById("date").value,
        type: document.getElementById("type").value,
        notes: notes,
        echauffement: noteEchauffement,
        debut: debutSeance,
        blocs: blocs.map(function (b) {
          return {
            exercice: {
              id: b.exercice.id, nom: b.exercice.nom, image_url: b.exercice.image_url,
              muscle: b.exercice.muscle, groupe: b.exercice.groupe
            },
            series: b.series,
            ouvert: b.ouvert,
            echauffement: !!b.echauffement
          };
        })
      };
      try { localStorage.setItem(cleBrouillon(), JSON.stringify(contenu)); } catch (e) {}
    }

    // Reprend la séance commencée avant de quitter la page
    function restaurerBrouillon() {
      const b = lireBrouillon();
      if (!b || !((b.blocs && b.blocs.length) || b.notes || b.echauffement)) return false;

      editionId = null;
      majTitres();
      document.getElementById("formulaire").hidden = false;
      document.getElementById("btn-nouvelle").hidden = true;
      document.getElementById("date").value = b.date || aujourdhui();
      document.getElementById("type").value = b.type || "";
      document.getElementById("notes").value = b.notes || "";
      document.getElementById("echauffement-note").value = b.echauffement || "";
      debutSeance = b.debut || Date.now();
      prendreXPAvant();

      blocs = (b.blocs || []).map(function (x) {
        const biblio = exercices.find(function (e) { return e.id === x.exercice.id; }) || x.exercice;
        return {
          exercice: biblio,
          series: x.series && x.series.length ? x.series : [nouvelleSerie(biblio)],
          indice: null,
          record: null,
          ouvert: !!x.ouvert,
          echauffement: !!x.echauffement
        };
      });
      majEchauffement(true);

      afficherChipsType();
      afficherBlocs();
      afficherResultats();
      blocs.forEach(chargerIndice);
      confirmer("Séance en cours reprise");
      return true;
    }

    /* ---------- Pastilles du type de séance ---------- */

    // Push, Pull, Leg et ce qui est écrit dans ton programme (hand, natation…)
    function typesProposes() {
      const liste = ["Push", "Pull", "Leg", "Cardio"];
      programme.forEach(function (p) {
        const dejaLa = liste.some(function (t) { return normaliser(t) === normaliser(p); });
        if (!estRepos(p) && !dejaLa) liste.push(p);
      });
      return liste;
    }

    function afficherChipsType() {
      const zone = document.getElementById("chips-type");
      const champ = document.getElementById("type");
      zone.innerHTML = "";

      const actuel = normaliser(champ.value);
      const types = typesProposes();
      const connu = types.some(function (t) { return normaliser(t) === actuel; });

      types.forEach(function (t) {
        const bouton = el("button", "chip", t);
        bouton.type = "button";
        bouton.setAttribute("aria-pressed", normaliser(t) === actuel ? "true" : "false");
        bouton.addEventListener("click", function () {
          champ.value = t;
          afficherChipsType();
          sauverBrouillon();
        });
        zone.appendChild(bouton);
      });

      // « Autre… » : on écrit sa propre séance dans le champ
      const autre = el("button", "chip", "Autre…");
      autre.type = "button";
      autre.setAttribute("aria-pressed", actuel !== "" && !connu ? "true" : "false");
      autre.addEventListener("click", function () {
        champ.value = "";
        afficherChipsType();
        champ.focus();
      });
      zone.appendChild(autre);
    }

    /* ---------- Formulaire : nouvelle séance, modification, fermeture ---------- */

    function majTitres() {
      const edition = editionId !== null;
      document.getElementById("titre-formulaire").textContent = edition ? "Modifier la séance" : "Nouvelle séance";
      document.getElementById("btn-ajouter").textContent = edition ? "Enregistrer les modifications" : "Enregistrer la séance";
    }

    function ouvrirNouvelle() {
      editionId = null;
      majTitres();
      document.getElementById("formulaire").hidden = false;
      document.getElementById("btn-nouvelle").hidden = true;
      document.getElementById("date").value = aujourdhui();
      document.getElementById("notes").value = "";
      document.getElementById("echauffement-note").value = "";
      blocs = [];
      majEchauffement(true);
      debutSeance = Date.now();
      prendreXPAvant();

      // La suite logique du programme est proposée d'office (tu peux la changer) ; sans programme : séance libre
      document.getElementById("type").value = prochaineSeance(programme, seances) || "";

      fermerPanneau();
      afficherChipsType();
      afficherBlocs();
      afficherResultats();
      document.getElementById("formulaire").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // Peut-on ouvrir une modification sans écraser une séance en cours de saisie ?
    async function peutEditer() {
      if (document.getElementById("formulaire").hidden) return true;
      if (editionId !== null) return demander("Abandonner les modifications en cours ?", { ok: "Abandonner", danger: true });
      if (formulaireRempli()) {
        informer("Termine ou annule d’abord la séance en cours.");
        return false;
      }
      return true;
    }

    // Rouvre une séance enregistrée dans le formulaire, déjà remplie
    async function ouvrirEdition(s, exos) {
      if (!(await peutEditer())) return;

      editionId = s.id;
      majTitres();
      document.getElementById("formulaire").hidden = false;
      document.getElementById("btn-nouvelle").hidden = true;
      document.getElementById("date").value = s.date;
      document.getElementById("type").value = s.type;
      document.getElementById("notes").value = s.notes || "";
      document.getElementById("echauffement-note").value = s.echauffement_note || "";

      blocs = exos.map(function (ex) {
        const biblio = exercices.find(function (e) { return e.id === ex.exercice_id; }) ||
          { id: ex.exercice_id, nom: ex.nom, image_url: ex.image_url, muscle: ex.muscle || "", groupe: "" };
        return {
          exercice: biblio,
          series: ex.series.map(function (x) {
            if (estCardio(biblio) || x.duree_s > 0) return Object.assign(champsDepuisCardio(x), { faite: true });
            return { rep: String(x.repetitions), charge: x.charge > 0 ? String(x.charge) : "", faite: true };
          }),
          indice: null,
          record: null,
          ouvert: false,
          echauffement: !!ex.echauffement
        };
      });
      majEchauffement(true);

      fermerPanneau();
      afficherChipsType();
      afficherBlocs();
      afficherResultats();
      document.getElementById("formulaire").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function fermerFormulaire() {
      editionId = null;
      document.getElementById("formulaire").hidden = true;
      document.getElementById("btn-nouvelle").hidden = false;
      document.getElementById("type").value = "";
      document.getElementById("notes").value = "";
      document.getElementById("echauffement-note").value = "";
      document.getElementById("recherche-exo").value = "";
      blocs = [];
      majEchauffement(true);
      fermerPanneau();
      afficherBlocs();
      afficherResultats();
      effacerBrouillon();
    }

    /* ---------- Recherche et choix des exercices ---------- */

    function afficherChoix() {
      const vide = exercices.length === 0;
      document.getElementById("aide-exo").hidden = !vide;
      document.getElementById("btn-ajout-exo").hidden = vide;
      if (vide) {
        fermerPanneau();
        return;
      }
      afficherChipsMuscle();
      afficherResultats();
    }

    // La liste d'exercices s'ouvre sous le bouton touché : séance ou échauffement
    function ouvrirPanneau(echauffement) {
      pourEchauffement = !!echauffement;
      const panneau = document.getElementById("picker-panneau");
      const bouton = document.getElementById(pourEchauffement ? "btn-ajout-echauffement" : "btn-ajout-exo");
      bouton.insertAdjacentElement("afterend", panneau);
      panneau.hidden = false;
      majBoutonsAjout();
      afficherResultats();
      document.getElementById("recherche-exo").focus();
    }

    function fermerPanneau() {
      document.getElementById("picker-panneau").hidden = true;
      majBoutonsAjout();
    }

    function majBoutonsAjout() {
      const ouvert = !document.getElementById("picker-panneau").hidden;
      document.getElementById("btn-ajout-exo").textContent = ouvert && !pourEchauffement ? "Fermer la liste" : "+ Ajouter un exercice";
      document.getElementById("btn-ajout-echauffement").textContent = ouvert && pourEchauffement ? "Fermer la liste" : "+ Cardio ou séries d’approche";
    }

    document.getElementById("btn-ajout-exo").addEventListener("click", function () {
      if (document.getElementById("picker-panneau").hidden || pourEchauffement) ouvrirPanneau(false);
      else fermerPanneau();
    });
    document.getElementById("btn-ajout-echauffement").addEventListener("click", function () {
      if (document.getElementById("picker-panneau").hidden || !pourEchauffement) ouvrirPanneau(true);
      else fermerPanneau();
    });

    // Quelque chose de saisi dans le formulaire ?
    function formulaireRempli() {
      return blocs.length > 0 || document.getElementById("notes").value.trim() !== "" ||
        document.getElementById("echauffement-note").value.trim() !== "";
    }

    // Résumé de l'échauffement (sur la ligne repliée) ; ouvert d'office s'il contient quelque chose
    function majEchauffement(ouvrirSiRempli) {
      const nb = blocs.filter(function (b) { return b.echauffement; }).length;
      const note = document.getElementById("echauffement-note").value.trim();
      const resume = [];
      if (nb) resume.push(nb + " exercice" + (nb > 1 ? "s" : ""));
      if (note) resume.push("note");
      document.getElementById("echauffement-resume").textContent = resume.length ? resume.join(" · ") : "facultatif";
      if (ouvrirSiRempli) document.getElementById("echauffement").open = resume.length > 0;
    }
    document.getElementById("echauffement-note").addEventListener("input", function () {
      majEchauffement(false);
      sauverBrouillon();
    });

    // Pastilles : seulement les muscles qui ont au moins un exercice
    function afficherChipsMuscle() {
      const zone = document.getElementById("chips-muscle");
      zone.innerHTML = "";
      const muscles = MUSCLES.filter(function (m) {
        return exercices.some(function (e) { return e.muscle === m; });
      });
      ["Tous"].concat(muscles).forEach(function (m) {
        const bouton = el("button", "chip", m);
        bouton.type = "button";
        bouton.setAttribute("aria-pressed", m === rechercheMuscle ? "true" : "false");
        bouton.addEventListener("click", function () {
          rechercheMuscle = m;
          afficherChipsMuscle();
          afficherResultats();
        });
        zone.appendChild(bouton);
      });
    }

    function afficherResultats() {
      const zone = document.getElementById("resultats");
      const haut = zone.scrollTop;
      zone.innerHTML = "";

      const mots = normaliser(document.getElementById("recherche-exo").value)
        .split(" ").filter(Boolean);

      const trouves = exercices.filter(function (e) {
        if (rechercheMuscle !== "Tous" && e.muscle !== rechercheMuscle) return false;
        const texte = normaliser(e.nom + " " + e.muscle + " " + e.groupe);
        return mots.every(function (m) { return texte.indexOf(m) !== -1; });
      }).sort(function (a, b) {
        return MUSCLES.indexOf(a.muscle) - MUSCLES.indexOf(b.muscle) ||
               a.nom.localeCompare(b.nom, "fr");
      });

      if (trouves.length === 0) {
        zone.appendChild(el("div", "aucun", "Aucun exercice trouvé."));
        return;
      }

      let muscleCourant = null;
      trouves.forEach(function (ex) {
        // Titre de section quand on parcourt toute la liste sans recherche
        if (mots.length === 0 && ex.muscle !== muscleCourant) {
          muscleCourant = ex.muscle;
          zone.appendChild(el("div", "resultat-titre", ex.muscle));
        }

        const deja = blocs.some(function (b) { return b.exercice.id === ex.id && !!b.echauffement === pourEchauffement; });
        const ligne = el("button", "resultat");
        ligne.type = "button";
        ligne.disabled = deja;
        ligne.appendChild(creerVignette(ex));

        const texte = el("div", "resultat-texte");
        texte.appendChild(el("div", "exo-nom-ligne", ex.nom));
        texte.appendChild(el("div", "mut", ex.muscle + " · " + ex.groupe));
        ligne.appendChild(texte);

        ligne.appendChild(el("span", "resultat-action", deja ? "Ajouté ✓" : "+ Ajouter"));
        ligne.addEventListener("click", function () { ajouterBloc(ex); });
        zone.appendChild(ligne);
      });
      zone.scrollTop = haut;
    }

    // Ce qui avait été fait la dernière fois et les records de l'exercice (pas pour une modification).
    // Une copie est gardée sur l'appareil : sans réseau, on s'en sert.
    async function chargerIndice(bloc) {
      if (editionId !== null || bloc.echauffement) return;
      const copie = lireLocal("infos-exos", {});
      let infos = copie[bloc.exercice.id] || null;
      try {
        infos = await chargerInfosExercice(bloc.exercice.id);
        copie[bloc.exercice.id] = infos;
        ecrireLocal("infos-exos", copie);
      } catch (e) {}
      if (!infos || blocs.indexOf(bloc) === -1) return;
      bloc.indice = infos.indice;
      // Les séries déjà validées dans cette séance comptent aussi
      bloc.record = Object.assign({ charge: 0, e1rm: 0, duree: 0, distance: 0, vitesse: 0 }, infos.record);
      bloc.series.forEach(function (s) { if (s.faite) majRecord(bloc, s); });
      // On ne reconstruit pas la liste si tu es en train de saisir un chiffre
      if (document.getElementById("blocs").contains(document.activeElement)) return;
      afficherBlocs();
    }

    function ajouterBloc(exercice) {
      const echauffement = pourEchauffement;
      if (blocs.some(function (b) { return b.exercice.id === exercice.id && !!b.echauffement === echauffement; })) return;

      // Les exercices précédents se replient, le nouveau s'ouvre
      blocs.forEach(function (b) { b.ouvert = false; });
      const bloc = { exercice: exercice, series: [nouvelleSerie(exercice)], indice: null, record: null, ouvert: true, echauffement: echauffement };
      blocs.push(bloc);

      document.getElementById("recherche-exo").value = "";
      fermerPanneau();
      afficherBlocs();
      afficherResultats();
      majEchauffement(false);

      const cartes = document.querySelectorAll(echauffement ? "#blocs-echauffement .bloc-exo" : "#blocs .bloc-exo");
      if (cartes.length) cartes[cartes.length - 1].scrollIntoView({ behavior: "smooth", block: "nearest" });
      chargerIndice(bloc);
    }

    document.getElementById("recherche-exo").addEventListener("input", afficherResultats);

    // Entrée : ajoute le premier résultat
    document.getElementById("recherche-exo").addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const premier = document.querySelector("#resultats .resultat:not(:disabled)");
      if (premier) premier.click();
    });

    /* ---------- Exercices de la séance (liste repliable) ---------- */

    // Séries qui seront enregistrées : au moins une répétition (muscu) ou une durée (cardio).
    // Une série ajoutée toute seule après une validation (auto) ne compte que si tu la valides ou la modifies.
    function seriesValides(bloc) {
      return bloc.series.filter(function (s) {
        if (s.auto && !s.faite) return false;
        return estCardio(bloc.exercice) ? dureeEnSecondes(s.duree) > 0 : parseInt(s.rep, 10) > 0;
      });
    }

    /* ---------- Records pendant la séance ---------- */

    // Met à jour le record de l'exercice avec cette série ; renvoie le type de record battu (ou "")
    function majRecord(bloc, serie) {
      if (!bloc.record || bloc.echauffement) return "";
      if (estCardio(bloc.exercice)) return majRecordCardio(bloc, serie);
      const charge = nombre(serie.charge);
      const reps = parseInt(serie.rep, 10) || 0;
      if (charge <= 0 || reps <= 0) return "";
      const e1rm = charge * (1 + reps / 30);
      // Première fois sur cet exercice : pas de record à fêter
      const avaitHistorique = bloc.record.charge > 0;
      let type = "";
      if (charge > bloc.record.charge) type = "charge";
      else if (e1rm > bloc.record.e1rm + 0.01) type = "e1rm";
      bloc.record.charge = Math.max(bloc.record.charge, charge);
      bloc.record.e1rm = Math.max(bloc.record.e1rm, e1rm);
      return avaitHistorique ? type : "";
    }

    // Cardio : plus longue distance, plus longue durée, meilleure vitesse moyenne
    function majRecordCardio(bloc, serie) {
      const v = valeursCardio(serie);
      const r = bloc.record;
      const avaitHistorique = r.duree > 0;
      let type = "";
      if (v.distance_km > 0 && r.distance > 0 && v.distance_km > r.distance + 0.001) type = "distance";
      else if (v.duree_s > r.duree && r.duree > 0) type = "duree";
      else if (v.vitesse > 0 && r.vitesse > 0 && v.vitesse > r.vitesse + 0.05) type = "vitesse";
      r.distance = Math.max(r.distance, v.distance_km);
      r.duree = Math.max(r.duree, v.duree_s);
      r.vitesse = Math.max(r.vitesse, v.vitesse);
      return avaitHistorique ? type : "";
    }

    function texteRecord(bloc, serie, type) {
      if (estCardio(bloc.exercice)) {
        const v = valeursCardio(serie);
        if (type === "distance") return "plus longue distance : " + nbFr(v.distance_km) + " km";
        if (type === "duree") return "plus longue durée : " + texteDuree(v.duree_s);
        return "meilleure vitesse moyenne : " + nbFr(v.vitesse) + " km/h";
      }
      return type === "charge"
        ? "charge la plus lourde : " + nb(nombre(serie.charge)) + " kg"
        : texteSerieSaisie(bloc, serie) + " (1RM estimé ≈ " + nb(nombre(serie.charge) * (1 + parseInt(serie.rep, 10) / 30)) + " kg)";
    }

    let minuteurAnnonce = null;
    function annoncerRecord(bloc, serie, type) {
      const zone = document.getElementById("annonce-record");
      zone.innerHTML = "";
      zone.appendChild(el("strong", "", "🎉 Nouveau record !"));
      zone.appendChild(el("span", "", bloc.exercice.nom + " · " + texteRecord(bloc, serie, type)));
      zone.hidden = false;
      zone.classList.remove("visible");
      void zone.offsetWidth;          // relance l'animation
      zone.classList.add("visible");
      vibrer([80, 60, 80, 60, 200]);
      clearTimeout(minuteurAnnonce);
      minuteurAnnonce = setTimeout(function () { zone.hidden = true; }, 4000);
    }

    /* ---------- Saisie d'une série ---------- */

    // Champ avec gros boutons − et + (pas : 1 répétition, 2,5 kg, 5 minutes…)
    function stepper(libelle, serie, cle, pas, mode, suggestion, quandChange) {
      const bloc = el("div", "stepper");
      bloc.appendChild(el("span", "stepper-libelle", libelle));
      const ligne = el("div", "stepper-ligne");
      const moins = el("button", "stepper-btn", "−");
      moins.type = "button";
      moins.setAttribute("aria-label", "Moins " + pas + " " + libelle);
      const champ = champNombre(libelle, serie[cle], mode, cle === "rep" || mode === "numeric" ? "1" : "0.1");
      if (suggestion !== "" && suggestion !== undefined) champ.placeholder = String(suggestion).replace(".", ",");
      const plus = el("button", "stepper-btn", "+");
      plus.type = "button";
      plus.setAttribute("aria-label", "Plus " + pas + " " + libelle);

      function changer(valeur) {
        serie[cle] = valeur;
        serie.auto = false;
        champ.value = valeur;
        quandChange();
      }
      function pousser(sens) {
        // Durée : ±5 min en gardant les secondes
        if (mode === "duree") {
          const depart = champ.value !== "" ? dureeEnSecondes(champ.value) : dureeEnSecondes(suggestion);
          changer(texteChampDuree(Math.max(0, depart + sens * pas * 60)));
          vibrer(10);
          return;
        }
        // Sans valeur, on part de la suggestion (ce que tu as fait la dernière fois)
        const base = champ.value !== "" ? nombre(champ.value) : nombre(suggestion);
        const v = Math.max(0, Math.round((base + sens * pas) * 100) / 100);
        changer(mode === "decimal" ? String(v).replace(".", ",") : String(v));
        vibrer(10);
      }
      moins.addEventListener("click", function () { pousser(-1); });
      plus.addEventListener("click", function () { pousser(1); });
      champ.addEventListener("input", function () { changer(champ.value); });

      ligne.appendChild(moins);
      ligne.appendChild(champ);
      ligne.appendChild(plus);
      bloc.appendChild(ligne);
      return bloc;
    }

    // ✓ Valider : la série est faite → chrono de repos, record éventuel, série suivante préparée
    function validerSerie(bloc, serie, avant) {
      const cardio = estCardio(bloc.exercice);
      if (cardio) {
        // Rien de saisi : on reprend ce que tu as fait la dernière fois
        if (serie.duree === "" && avant && avant.duree_s > 0) {
          const precedent = champsDepuisCardio(avant);
          Object.keys(precedent).forEach(function (k) { if (serie[k] === "") serie[k] = precedent[k]; });
        }
        if (!(dureeEnSecondes(serie.duree) > 0)) {
          informer("Indique la durée : 30 pour 30 min, ou 24,57 pour 24 min 57 s.");
          return;
        }
        // Vitesse calculée si tu as donné la distance mais pas la vitesse
        if (serie.vitesse === "" && valeursCardio(serie).vitesse > 0 && champsCardio(bloc.exercice.nom).indexOf("vitesse") !== -1) {
          serie.vitesse = String(valeursCardio(serie).vitesse);
        }
      } else {
        if (serie.rep === "" && avant) serie.rep = String(avant.repetitions);
        if (serie.charge === "" && avant && avant.charge > 0) serie.charge = String(avant.charge);
        if (!(parseInt(serie.rep, 10) > 0)) {
          informer("Indique le nombre de répétitions de la série.");
          return;
        }
      }
      serie.faite = true;
      serie.auto = false;

      const type = editionId === null ? majRecord(bloc, serie) : "";
      serie.record = !!type;
      serie.typeRecord = type;
      if (type) annoncerRecord(bloc, serie, type);
      else vibrer(30);

      // Muscu : la série suivante est préparée avec les mêmes valeurs, et le chrono de repos démarre
      if (!cardio && bloc.series[bloc.series.length - 1] === serie) {
        bloc.series.push({ rep: serie.rep, charge: serie.charge, auto: true });
      }
      afficherBlocs();
      if (!cardio && !bloc.echauffement && editionId === null && window.chronoSportApp) window.chronoSportApp.demarrer();   // chrono.js
    }

    // Résumé affiché quand l'exercice est replié
    function resumeBloc(bloc) {
      const valides = seriesValides(bloc);
      if (valides.length === 0) return estCardio(bloc.exercice) ? "Rien de saisi" : "Aucune série saisie";
      if (estCardio(bloc.exercice)) {
        return valides.map(function (s) { return texteSerieSaisie(bloc, s); }).join(" + ");
      }
      const premiere = texteSerieSaisie(bloc, valides[0]);
      const derniere = texteSerieSaisie(bloc, valides[valides.length - 1]);
      return valides.length + " série" + (valides.length > 1 ? "s" : "") + " · " +
        (premiere === derniere ? premiere : premiere + " → " + derniere);
    }

    // Les réglages d'une série : Reps / kg (muscu) ou durée, distance… (cardio)
    function reglagesSerie(bloc, serie, avant, quandChange) {
      const reglages = el("div", "serie-reglages" + (estCardio(bloc.exercice) ? " cardio" : ""));
      if (!estCardio(bloc.exercice)) {
        reglages.appendChild(stepper("Reps", serie, "rep", 1, "numeric", avant ? avant.repetitions : "", quandChange));
        reglages.appendChild(stepper("kg", serie, "charge", 2.5, "decimal", avant && avant.charge > 0 ? avant.charge : "", quandChange));
        return reglages;
      }
      const precedent = avant && avant.duree_s > 0 ? champsDepuisCardio(avant) : {};
      champsCardio(bloc.exercice.nom).forEach(function (cle) {
        const c = CHAMPS_CARDIO[cle];
        let suggestion = precedent[cle] || "";
        // Vitesse : calculée à partir de la durée et de la distance déjà saisies
        if (cle === "vitesse" && valeursCardio(serie).vitesse > 0 && serie.vitesse === "") suggestion = valeursCardio(serie).vitesse;
        reglages.appendChild(stepper(c.libelle, serie, cle, c.pas, c.mode, suggestion, quandChange));
      });
      reglages.appendChild(el("p", "mut petit aide-duree", "Durée : 24,57 = 24 min 57 s"));
      return reglages;
    }

    function afficherBlocs() {
      const zone = document.getElementById("blocs");
      const zoneEchauffement = document.getElementById("blocs-echauffement");
      zone.innerHTML = "";
      zoneEchauffement.innerHTML = "";

      if (!blocs.some(function (b) { return !b.echauffement; })) {
        zone.appendChild(el("p", "mut aucun-exo", "Aucun exercice ajouté pour l’instant."));
      }

      blocs.forEach(function (bloc, i) {
        const cardio = estCardio(bloc.exercice);
        const carte = el("div", "bloc-exo" + (bloc.ouvert ? " ouvert" : "") + (cardio ? " cardio" : ""));

        // Ligne repliable : photo, nom, résumé
        const tete = el("div", "bloc-tete");
        const bascule = el("button", "bloc-bascule");
        bascule.type = "button";
        bascule.setAttribute("aria-expanded", String(bloc.ouvert));
        bascule.appendChild(creerVignette(bloc.exercice));

        const texte = el("span", "bloc-texte");
        texte.appendChild(el("span", "exo-nom-ligne", bloc.exercice.nom));
        const resume = el("span", "bloc-resume", resumeBloc(bloc));
        texte.appendChild(resume);
        bascule.appendChild(texte);
        bascule.appendChild(el("span", "chevron", "›"));
        bascule.addEventListener("click", function () {
          bloc.ouvert = !bloc.ouvert;
          afficherBlocs();
        });
        tete.appendChild(bascule);

        const retirer = el("button", "btn-mini", "✕");
        retirer.type = "button";
        retirer.setAttribute("aria-label", "Retirer " + bloc.exercice.nom + " de la séance");
        retirer.addEventListener("click", async function () {
          if (seriesValides(bloc).length > 0 && !(await demander("Retirer « " + bloc.exercice.nom + " » de la séance ?", { ok: "Retirer", danger: true }))) return;
          blocs.splice(i, 1);
          afficherBlocs();
          afficherResultats();
          majEchauffement(false);
        });
        tete.appendChild(retirer);
        carte.appendChild(tete);

        // Détail : visible seulement quand l'exercice est ouvert
        if (bloc.ouvert) {
          const corps = el("div", "bloc-corps");

          if (bloc.indice) {
            const indice = el("div", "indice");
            indice.appendChild(el("span", null,
              "Dernière fois (" + dateCourte(bloc.indice.date) + ") : " +
              bloc.indice.series.map(texteSerie).join(" · ")));
            const reprendre = el("button", "btn-suppr", "Reprendre");
            reprendre.type = "button";
            reprendre.addEventListener("click", function () {
              bloc.series = bloc.indice.series.map(function (s) {
                if (cardio) return champsDepuisCardio(s);
                return { rep: String(s.repetitions), charge: s.charge > 0 ? String(s.charge) : "" };
              });
              afficherBlocs();
            });
            indice.appendChild(reprendre);
            corps.appendChild(indice);
          }

          const precedentes = bloc.indice ? bloc.indice.series : [];
          const nom = cardio ? "Partie" : "Série";
          bloc.series.forEach(function (serie, j) {
            const avant = precedentes[j];

            // Série faite : une ligne compacte (la toucher permet de la corriger)
            if (serie.faite) {
              const ligne = el("button", "serie-faite" + (serie.record ? " record" : ""));
              ligne.type = "button";
              ligne.appendChild(el("span", "num-serie ok", "✓"));
              ligne.appendChild(el("span", "serie-valeurs", texteSerieSaisie(bloc, serie)));
              if (serie.record) ligne.appendChild(el("span", "badge-record", "🏆 Record"));
              ligne.appendChild(el("span", "serie-modifier", "Modifier"));
              ligne.setAttribute("aria-label", nom + " " + (j + 1) + " faite, toucher pour la modifier");
              ligne.addEventListener("click", function () {
                serie.faite = false;
                afficherBlocs();
              });
              corps.appendChild(ligne);
              return;
            }

            // Série à faire : gros boutons − / + et ✓ Valider
            const carteSerie = el("div", "serie-edition");
            const haut = el("div", "serie-haut");
            haut.appendChild(el("strong", "", cardio && bloc.series.length === 1 ? "Aujourd’hui" : nom + " " + (j + 1)));
            // (En cardio, « Dernière fois » est déjà rappelé au-dessus)
            if (avant && !cardio) haut.appendChild(el("span", "serie-avant", "Dernière fois : " + texteSerie(avant)));
            const supprimer = el("button", "btn-mini", "✕");
            supprimer.type = "button";
            supprimer.setAttribute("aria-label", "Supprimer : " + nom.toLowerCase() + " " + (j + 1));
            supprimer.addEventListener("click", function () {
              bloc.series.splice(j, 1);
              if (bloc.series.length === 0) bloc.series.push(nouvelleSerie(bloc.exercice));
              afficherBlocs();
            });
            haut.appendChild(supprimer);
            carteSerie.appendChild(haut);

            function quandChange() {
              resume.textContent = resumeBloc(bloc);
              sauverBrouillon();
            }
            carteSerie.appendChild(reglagesSerie(bloc, serie, avant, quandChange));

            const valider = el("button", "btn valider-serie", cardio ? "✓ Valider" : "✓ Valider la série " + (j + 1));
            valider.type = "button";
            valider.addEventListener("click", function () { validerSerie(bloc, serie, avant); });
            carteSerie.appendChild(valider);
            corps.appendChild(carteSerie);
          });

          // Ajouter une série (copie les valeurs de la précédente) ; en cardio, une nouvelle partie vide
          const ajout = el("button", "btn-suppr", cardio ? "+ Ajouter une partie" : "+ Série");
          ajout.type = "button";
          ajout.addEventListener("click", function () {
            const derniere = bloc.series[bloc.series.length - 1];
            bloc.series.push(cardio ? nouvelleSerie(bloc.exercice) : { rep: derniere.rep, charge: derniere.charge, auto: true });
            afficherBlocs();
          });
          corps.appendChild(ajout);

          carte.appendChild(corps);
        }

        (bloc.echauffement ? zoneEchauffement : zone).appendChild(carte);
      });

      sauverBrouillon();
    }

    /* ---------- Bilan et filtres ---------- */

    function afficherBilan() {
      const zone = document.getElementById("bilan");
      zone.innerHTML = "";

      const lundi = new Date();
      lundi.setHours(12, 0, 0, 0);
      lundi.setDate(lundi.getDate() - ((lundi.getDay() + 6) % 7));
      const lundiTexte = versTexte(lundi);
      const aujourdhuiTexte = aujourdhui();
      const mois = aujourdhuiTexte.slice(0, 7);

      const semaine = seances.filter(function (s) {
        return s.date >= lundiTexte && s.date <= aujourdhuiTexte;
      }).length;
      const ceMois = seances.filter(function (s) { return s.date.slice(0, 7) === mois; }).length;

      majResumeReplie(semaine, ceMois);

      [["Cette semaine", semaine], ["Ce mois-ci", ceMois], ["Au total", seances.length]].forEach(function (b) {
        const carte = el("div", "mini-bilan");
        carte.appendChild(el("div", "t", b[0]));
        carte.appendChild(el("div", "v", String(b[1])));
        zone.appendChild(carte);
      });
    }

    // La ligne repliée résume le bilan et le filtre choisi : « 2 cette semaine · 8 ce mois · Push »
    let resumeBilan = "";
    function majResumeReplie(semaine, ceMois) {
      if (semaine !== undefined) resumeBilan = semaine + " cette semaine · " + ceMois + " ce mois";
      document.getElementById("replier-resume").textContent = resumeBilan + (filtre !== "Tous" ? " · " + filtre : "");
      document.getElementById("replier").classList.toggle("filtre-actif", filtre !== "Tous");
    }

    function afficherFiltres() {
      const zone = document.getElementById("filtres-historique");
      zone.innerHTML = "";
      FILTRES.forEach(function (f) {
        const nb = f === "Tous"
          ? seances.length
          : seances.filter(function (s) { return categorie(s.type) === f; }).length;
        const bouton = el("button", "chip", f + " · " + nb);
        bouton.type = "button";
        bouton.setAttribute("aria-pressed", f === filtre ? "true" : "false");
        bouton.addEventListener("click", function () {
          filtre = f;
          afficherFiltres();
          majResumeReplie();
          afficherHistorique(false);
        });
        zone.appendChild(bouton);
      });
    }

    /* ---------- Historique rangé par mois ---------- */

    // recharger = false : on réutilise les séances déjà chargées (simple changement de filtre)
    // Mois dépliés (gardés quand on change de filtre ou qu'on supprime une séance)
    let moisOuverts = null;

    // L'historique : un bloc par mois (repliable), et dans chaque mois les séances regroupées par nom
    async function afficherHistorique(recharger) {
      if (recharger !== false) {
        seances = await chargerSeances();
        afficherBilan();
        afficherFiltres();
      }

      const zone = document.getElementById("historique");
      zone.innerHTML = "";

      const filtrees = seances.filter(function (s) {
        return filtre === "Tous" || categorie(s.type) === filtre;
      });

      if (filtrees.length === 0) {
        zone.appendChild(el("div", "vide", seances.length
          ? "Aucune séance dans cette catégorie."
          : "Aucune séance enregistrée. Touche « Nouvelle séance » après ton entraînement."));
        return;
      }

      // Séances rangées par mois (du plus récent au plus ancien)
      const mois = [];
      const parMois = {};
      filtrees.forEach(function (s) {
        const cle = s.date.slice(0, 7);
        if (!parMois[cle]) {
          parMois[cle] = [];
          mois.push(cle);
        }
        parMois[cle].push(s);
      });
      if (!moisOuverts) moisOuverts = new Set([mois[0]]);     // au début, seul le mois le plus récent est ouvert

      mois.forEach(function (cle) {
        const liste = parMois[cle];
        const bloc = el("details", "mois-bloc");
        bloc.open = moisOuverts.has(cle);

        const resume = el("summary", "mois-resume");
        const nomMois = new Date(cle + "-15T12:00:00").toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
        const titre = el("span", "mois-titre");
        titre.appendChild(el("strong", "", nomMois.charAt(0).toUpperCase() + nomMois.slice(1)));
        // Petit résumé : « 8 séances · Push 3 · Pull 3 · Leg 2 »
        const parType = {};
        liste.forEach(function (s) { parType[s.type] = (parType[s.type] || 0) + 1; });
        titre.appendChild(el("span", "mut", liste.length + " séance" + (liste.length > 1 ? "s" : "") + " · " +
          Object.keys(parType).map(function (t) { return t + " " + parType[t]; }).join(" · ")));
        resume.appendChild(titre);
        resume.appendChild(el("span", "chevron", "›"));
        bloc.appendChild(resume);

        const corps = el("div", "mois-corps");
        bloc.appendChild(corps);

        // Les détails d'un mois ne sont chargés qu'à son ouverture
        let charge = false;
        async function remplir() {
          if (charge) return;
          charge = true;
          corps.innerHTML = '<div class="squelette petit"></div><div class="squelette petit"></div>';
          try {
            const parSeance = grouperSeries(await chargerSeries(liste.map(function (s) { return s.id; })));
            corps.innerHTML = "";
            remplirMois(corps, liste, parSeance);
          } catch (e) {
            charge = false;
            corps.innerHTML = "";
            corps.appendChild(el("p", "mut", navigator.onLine ? "Détails indisponibles pour le moment." : "Pas de réseau : les détails reviendront avec la connexion."));
          }
        }
        bloc.addEventListener("toggle", function () {
          if (bloc.open) {
            moisOuverts.add(cle);
            remplir();
          } else {
            moisOuverts.delete(cle);
          }
        });
        if (bloc.open) remplir();
        zone.appendChild(bloc);
      });
    }

    // Dans un mois : les séances qui portent le même nom sont regroupées (« Leg · 3 séances »)
    function remplirMois(corps, liste, parSeance) {
      const groupes = [];
      const index = {};
      liste.forEach(function (s) {
        const cle = normaliser(s.type);
        if (!(cle in index)) {
          index[cle] = groupes.length;
          groupes.push({ type: s.type, seances: [] });
        }
        groupes[index[cle]].seances.push(s);
      });

      groupes.forEach(function (g) {
        // Une seule séance de ce type dans le mois : on l'affiche directement
        if (g.seances.length === 1) {
          corps.appendChild(ligneSeance(g.seances[0], parSeance[g.seances[0].id] || []));
          return;
        }
        const groupe = el("details", "groupe-seances");
        const resume = el("summary");
        resume.appendChild(el("span", "tag " + categorie(g.type).toLowerCase(), g.type));
        const infos = el("span", "groupe-infos");
        infos.appendChild(el("strong", "", g.seances.length + " séances"));
        infos.appendChild(el("span", "mut", "Les " + g.seances.map(function (s) {
          return new Date(s.date + "T12:00:00").getDate();
        }).reverse().join(", ")));
        resume.appendChild(infos);
        resume.appendChild(el("span", "chevron", "›"));
        groupe.appendChild(resume);

        const contenu = el("div", "groupe-contenu");
        g.seances.forEach(function (s) { contenu.appendChild(ligneSeance(s, parSeance[s.id] || [])); });
        groupe.appendChild(contenu);
        corps.appendChild(groupe);
      });
    }

    // Une séance : ligne compacte qui s'ouvre pour montrer les exercices, les notes et les actions
    function ligneSeance(s, exos) {
      const d = new Date(s.date + "T12:00:00");
      // Hors échauffement : séries de muscu, minutes et km de cardio
      const travail = exos.filter(function (e) { return !e.echauffement; });
      let nbSeries = 0, minutes = 0, km = 0;
      travail.forEach(function (e) {
        e.series.forEach(function (x) {
          if (x.duree_s > 0) { minutes += x.duree_s / 60; km += x.distance_km || 0; }
          else nbSeries++;
        });
      });
      const morceaux = [];
      if (travail.length) morceaux.push(travail.length + " exercice" + (travail.length > 1 ? "s" : ""));
      if (nbSeries) morceaux.push(nbSeries + " série" + (nbSeries > 1 ? "s" : ""));
      if (minutes) morceaux.push(Math.round(minutes) + " min de cardio");
      if (km) morceaux.push(nbFr(km) + " km");

      const ligne = el("details", "seance-ligne");
      const resume = el("summary");

      const bloc = el("span", "date-bloc");
      bloc.appendChild(el("strong", null, String(d.getDate())));
      bloc.appendChild(el("small", null, d.toLocaleDateString("fr-FR", { weekday: "short" })));
      resume.appendChild(bloc);

      const infos = el("span", "seance-infos");
      infos.appendChild(el("span", "tag " + categorie(s.type).toLowerCase(), s.type));
      infos.appendChild(el("span", "mut", morceaux.length
        ? morceaux.join(" · ")
        : (s.notes ? "Notes uniquement" : "Aucun détail")));
      resume.appendChild(infos);
      resume.appendChild(el("span", "chevron", "›"));
      ligne.appendChild(resume);

      const detail = el("div", "seance-detail");
      if (s.echauffement_note) detail.appendChild(el("div", "notes-seance echauffement-note", "🔥 Échauffement : " + s.echauffement_note));
      exos.forEach(function (ex) { detail.appendChild(creerLigneExercice(ex)); });
      if (s.notes) detail.appendChild(el("div", "notes-seance", s.notes));

      const actions = el("div", "seance-actions");
      const modifier = el("button", "btn-suppr", "Modifier");
      modifier.type = "button";
      modifier.addEventListener("click", function () { ouvrirEdition(s, exos); });
      actions.appendChild(modifier);

      const supprimer = el("button", "btn-suppr", "Supprimer");
      supprimer.type = "button";
      supprimer.addEventListener("click", function () {
        supprimerAvecAnnulation("Séance du " + dateFr(s.date) + " supprimée", ligne,
          function () { return supprimerSeance(s.id); }, afficherHistorique);
      });
      actions.appendChild(supprimer);

      detail.appendChild(actions);
      ligne.appendChild(detail);
      return ligne;
    }

    /* ---------- Récap de fin de séance ---------- */

    async function prendreXPAvant() {
      xpAvant = null;
      try { xpAvant = (await chargerXP()).xp; } catch (e) {}
    }

    function dureeTexte(ms) {
      const min = Math.round(ms / 60000);
      return min >= 60 ? Math.floor(min / 60) + " h " + String(min % 60).padStart(2, "0") : min + " min";
    }

    function lancerConfettis() {
      const zone = document.getElementById("confettis");
      zone.innerHTML = "";
      const couleurs = ["#ff6b35", "#ffb020", "#2dd4bf", "#a78bfa", "#f472b6", "#60a5fa"];
      for (let i = 0; i < 40; i++) {
        const c = el("span", "confetti");
        c.style.left = Math.random() * 100 + "%";
        c.style.background = couleurs[i % couleurs.length];
        c.style.animationDelay = Math.random() * 0.6 + "s";
        c.style.animationDuration = 1.6 + Math.random() * 1.2 + "s";
        c.style.transform = "rotate(" + Math.random() * 360 + "deg)";
        zone.appendChild(c);
      }
    }

    // stats : calculées à partir des exercices saisis (hors échauffement), avant de fermer le formulaire
    function statsSeance() {
      let series = 0, volume = 0, minutes = 0, km = 0;
      const records = [];
      const travail = blocs.filter(function (b) { return !b.echauffement && seriesValides(b).length; });
      travail.forEach(function (bloc) {
        seriesValides(bloc).forEach(function (s) {
          if (estCardio(bloc.exercice)) {
            const v = valeursCardio(s);
            minutes += v.duree_s / 60;
            km += v.distance_km;
          } else {
            series++;
            volume += (parseInt(s.rep, 10) || 0) * nombre(s.charge);
          }
          if (s.record) records.push(bloc.exercice.nom + " : " + texteRecord(bloc, s, s.typeRecord));
        });
      });
      return {
        exercices: travail.length,
        series: series,
        volume: volume,
        minutes: minutes,
        km: km,
        records: records,
        duree: debutSeance ? Date.now() - debutSeance : 0
      };
    }

    async function afficherRecap(type, stats, horsLigne) {
      document.getElementById("recap-sous").textContent = type +
        (stats.duree > 60000 && stats.duree < 5 * 3600000 ? " · " + dureeTexte(stats.duree) : "");

      const chiffres = document.getElementById("recap-chiffres");
      chiffres.innerHTML = "";
      const cases = [[String(stats.exercices), stats.exercices > 1 ? "exercices" : "exercice"]];
      if (stats.series || !stats.minutes) {
        cases.push([String(stats.series), "séries"]);
        cases.push([stats.volume >= 1000 ? nb(stats.volume / 1000) + " t" : Math.round(stats.volume) + " kg", "soulevés"]);
      }
      if (stats.minutes) {
        cases.push([String(Math.round(stats.minutes)), "min de cardio"]);
        if (stats.km && cases.length < 4) cases.push([nbFr(stats.km), "km"]);
      }
      cases.slice(0, 4).forEach(function (c) {
        const b = el("div", "recap-chiffre");
        b.appendChild(el("strong", "", c[0]));
        b.appendChild(el("span", "", c[1]));
        chiffres.appendChild(b);
      });

      const records = document.getElementById("recap-records");
      records.innerHTML = "";
      if (stats.records.length) {
        records.appendChild(el("strong", "", "🏆 " + (stats.records.length > 1 ? stats.records.length + " records battus" : "Record battu")));
        stats.records.forEach(function (r) { records.appendChild(el("span", "", r)); });
      }

      const xp = document.getElementById("recap-xp");
      xp.textContent = horsLigne ? "Pas de réseau : ta séance sera envoyée (et ton XP comptée) dès que tu seras connecté." : "";
      document.getElementById("recap").hidden = false;
      document.body.classList.add("sans-defilement");
      lancerConfettis();
      vibrer([60, 40, 60]);
      document.getElementById("recap-ok").focus();

      // XP gagnée : calculée par le serveur, on compare avant / après
      if (!horsLigne && xpAvant !== null) {
        try {
          const apres = (await chargerXP()).xp;
          const gain = apres - xpAvant;
          const avant = niveauDe(xpAvant).niveau, maintenant = niveauDe(apres).niveau;
          xp.textContent = gain > 0
            ? "+" + gain + " XP" + (maintenant > avant ? " · 🎉 Niveau " + maintenant + " atteint !" : "")
            : "Pas d’XP pour celle-ci (une seule séance compte par jour, avec au moins 3 séries ou 20 min de cardio).";
          xp.classList.toggle("gain", gain > 0);
        } catch (e) {}
      }
    }

    document.getElementById("recap-ok").addEventListener("click", function () {
      document.getElementById("recap").hidden = true;
      document.body.classList.remove("sans-defilement");
    });

    /* ---------- Séances en attente d'envoi ---------- */

    function afficherAttente() {
      const n = seancesEnAttente(moiId).length;
      const zone = document.getElementById("attente");
      zone.hidden = !n;
      zone.textContent = n
        ? "📶 " + (n > 1 ? n + " séances enregistrées" : "1 séance enregistrée") +
          " sur ton téléphone, en attente de réseau. Elle" + (n > 1 ? "s" : "") + " partira toute seule."
        : "";
    }

    document.addEventListener("seances-envoyees", async function (e) {
      afficherAttente();
      confirmer(e.detail > 1 ? e.detail + " séances envoyées" : "Séance hors connexion envoyée");
      try { await afficherHistorique(); } catch (err) {}
    });

    /* ---------- Enregistrement ---------- */

    document.getElementById("btn-nouvelle").addEventListener("click", ouvrirNouvelle);

    document.getElementById("btn-annuler").addEventListener("click", async function () {
      const contenu = formulaireRempli();
      const question = editionId !== null
        ? "Annuler les modifications ?"
        : "Abandonner cette séance ? Les exercices saisis seront perdus.";
      if (contenu && !(await demander(question, { ok: editionId !== null ? "Annuler les modifications" : "Abandonner", annuler: "Continuer", danger: true }))) return;
      if (window.chronoSportApp) window.chronoSportApp.arreter();
      fermerFormulaire();
    });

    // Le brouillon suit aussi la date, le type et les notes
    ["date", "type", "notes"].forEach(function (id) {
      document.getElementById(id).addEventListener("input", sauverBrouillon);
    });
    document.getElementById("type").addEventListener("input", afficherChipsType);

    document.getElementById("btn-ajouter").addEventListener("click", async function () {
      const bouton = this;
      const type = document.getElementById("type").value.trim();
      if (!type) {
        document.getElementById("type").focus();
        return;
      }

      // Séries valides : au moins une répétition (muscu) ou une durée (cardio) ; l'échauffement est marqué
      const lignes = [];
      blocs.forEach(function (bloc) {
        let numero = 0;
        seriesValides(bloc).forEach(function (s) {
          numero++;
          const ligne = {
            exercice_id: bloc.exercice.id,
            numero: numero,
            repetitions: 0,
            charge: 0
          };
          if (estCardio(bloc.exercice)) {
            Object.assign(ligne, valeursCardio(s));
          } else {
            ligne.repetitions = parseInt(s.rep, 10);
            ligne.charge = parseFloat(String(s.charge).replace(",", ".")) || 0;
          }
          if (bloc.echauffement) ligne.echauffement = true;
          lignes.push(ligne);
        });
      });

      const noteEchauffement = document.getElementById("echauffement-note").value.trim();
      const donnees = {
        date: document.getElementById("date").value || aujourdhui(),
        type: type,
        notes: document.getElementById("notes").value.trim()
      };
      // La colonne n'existe qu'une fois le script SQL lancé : on ne l'envoie que si elle sert
      if (noteEchauffement || seances.some(function (x) { return "echauffement_note" in x; })) {
        donnees.echauffement_note = noteEchauffement || null;
      }
      bouton.disabled = true;
      try {
        if (editionId !== null) {
          // Modification d'une séance déjà enregistrée
          await modifierSeance(editionId, donnees);
          await remplacerSeries(editionId, lignes);
          fermerFormulaire();
          confirmer("Séance modifiée");
        } else {
          // Nouvelle séance (sans réseau, elle est gardée sur le téléphone et envoyée plus tard)
          const stats = statsSeance();
          let horsLigne = false;
          try {
            await enregistrerSeanceComplete(donnees, lignes);
          } catch (e) {
            if (!estErreurReseau(e)) throw e;
            mettreEnAttente(moiId, donnees, lignes);
            horsLigne = true;
          }
          if (window.chronoSportApp) window.chronoSportApp.arreter();
          fermerFormulaire();
          afficherAttente();
          afficherRecap(type, stats, horsLigne);
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
        try { await afficherHistorique(); } catch (e) {}
      } catch (e) {
        informer("Erreur : " + e.message);
      } finally {
        bouton.disabled = false;
      }
    });

    // Lien « Activite.html#nouvelle » (bouton ＋ ou séance du jour) : ouvre une nouvelle séance
    function ouvrirSiDemande() {
      if (location.hash !== "#nouvelle") return;
      history.replaceState(null, "", location.pathname);
      if (document.getElementById("formulaire").hidden) ouvrirNouvelle();
      else document.getElementById("formulaire").scrollIntoView({ behavior: "smooth" });
    }
    window.addEventListener("hashchange", ouvrirSiDemande);

    /* ---------- Démarrage ---------- */

    (async function () {
      const user = await exigerConnexion();
      if (!user) return;
      moiId = user.id;
      document.getElementById("date").value = aujourdhui();

      // Exercices et programme : copie gardée sur l'appareil pour la salle sans réseau
      try {
        exercices = await chargerExercices();
        ecrireLocal("exercices", exercices);
      } catch (e) {
        exercices = lireLocal("exercices", []);
        if (!exercices.length) informer("Erreur de chargement : " + e.message);
      }
      try {
        programme = (await chargerProfil()).programme;
        ecrireLocal("programme", programme);
      } catch (e) {
        programme = lireLocal("programme", PROGRAMME_DEFAUT);
      }
      afficherChoix();
      // Reprend la séance commencée avant de quitter la page ; sinon « ＋ Séance » en ouvre une nouvelle
      if (!restaurerBrouillon()) ouvrirSiDemande();
      afficherAttente();
      try {
        await afficherHistorique();
      } catch (e) {
        document.getElementById("historique").innerHTML = "";
        document.getElementById("historique").appendChild(el("div", "vide",
          navigator.onLine ? "Historique indisponible pour le moment." : "Pas de réseau : l’historique reviendra avec la connexion."));
      }
    })();
  </script>
</body>
