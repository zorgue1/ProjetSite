<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SportApp – Rapport</title>
  <link rel="stylesheet" href="../CSS/Couleur.css">
  <link rel="stylesheet" href="../CSS/Commun.css">
  <link rel="stylesheet" href="../CSS/Rapport.css">
</head>
<body>
  <header class="bandeau">
    <nav>
      <a href="Accueil.html">Accueil</a>
      <a href="Activite.html">Activité</a>
      <a href="Exercices.html">Exercices</a>
      <a href="Rapport.html" class="actif">Rapport</a>
      <a href="Parametres.html">Paramètres</a>
      <button class="deconnexion" id="btn-deconnexion">Déconnexion</button>
    </nav>
  </header>

  <main>

    <h2>Rapport</h2>

    <!-- Chiffres clés -->
    <section class="stats">
      <div class="card">
        <div class="mut">Cette semaine</div>
        <div class="chiffre" id="stat-semaine">0</div>
      </div>
      <div class="card">
        <div class="mut">Moyenne / semaine</div>
        <div class="chiffre" id="stat-moyenne">0</div>
      </div>
      <div class="card">
        <div class="mut">Total sur la période</div>
        <div class="chiffre" id="stat-total">0</div>
      </div>
    </section>

    <!-- Courbe des séances -->
    <section class="card">
      <label for="periode">Période</label>
      <select id="periode">
        <option value="4">4 semaines</option>
        <option value="8" selected>8 semaines</option>
        <option value="12">12 semaines</option>
        <option value="26">6 mois</option>
      </select>

      <p class="mut legende">
        Nombre de séances par semaine (les semaines commencent le lundi).
        Ligne pointillée : ta moyenne.
      </p>

      <div class="graphique" id="graphique"></div>
    </section>

    <!-- Courbe de poids -->
    <section class="card">
      <h2>Poids</h2>
      <div class="stats-poids">
        <div>
          <div class="mut">Poids actuel</div>
          <div class="chiffre-poids" id="poids-actuel">—</div>
        </div>
        <div>
          <div class="mut">Évolution sur la période</div>
          <div class="chiffre-poids" id="poids-evolution">—</div>
        </div>
      </div>
      <div class="graphique" id="graphique-poids"></div>
    </section>

    <!-- Progression par exercice -->
    <section class="card">
      <h2>Progression par exercice</h2>

      <div id="prog-selection">
        <label for="recherche-prog">Exercice</label>
        <input id="recherche-prog" type="search" placeholder="Rechercher un exercice…" autocomplete="off">
        <select id="choix-prog"></select>
      </div>

      <div class="vide" id="prog-aucune" hidden></div>

      <div id="prog-contenu" hidden>
        <div class="records" id="records"></div>

        <label for="metrique">Courbe</label>
        <select id="metrique"></select>
        <div class="graphique" id="graphique-prog"></div>
        <p class="mut" id="prog-note"></p>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../JS/supabase.js"></script>
  <script src="../JS/donnees.js"></script>
  <script>
    let seances = [];
    let poids = [];
    let exercicesProg = [];   // bibliothèque d'exercices
    let idProg = null;        // exercice choisi
    let idCharge = null;      // exercice dont les séries sont chargées
    let donneesProg = [];     // séries de l'exercice choisi

    // Date au format AAAA-MM-JJ (heure locale)
    function versTexte(date) {
      const d = new Date(date.getTime());
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }

    function enDate(texte) {
      return new Date(texte + "T12:00:00");
    }

    // Renvoie le lundi de la semaine d'une date (texte AAAA-MM-JJ)
    function lundiDe(texte) {
      const d = enDate(texte);
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      return versTexte(d);
    }

    /* ---------- Séances par semaine ---------- */

    function afficher() {
      const N = parseInt(document.getElementById("periode").value, 10);
      const lundiActuel = lundiDe(versTexte(new Date()));

      // Une entrée par semaine, de la plus ancienne à la plus récente
      const semaines = [];
      for (let k = N - 1; k >= 0; k--) {
        const d = enDate(lundiActuel);
        d.setDate(d.getDate() - 7 * k);
        semaines.push({ debut: versTexte(d), n: 0 });
      }

      // Compter les séances de chaque semaine
      seances.forEach(function (s) {
        const semaine = semaines.find(function (w) { return w.debut === lundiDe(s.date); });
        if (semaine) semaine.n++;
      });

      const total = semaines.reduce(function (somme, w) { return somme + w.n; }, 0);
      const moyenne = total / N;

      document.getElementById("stat-semaine").textContent = semaines[N - 1].n;
      document.getElementById("stat-moyenne").textContent =
        moyenne.toFixed(1).replace(".", ",");
      document.getElementById("stat-total").textContent = total;

      dessiner(semaines, moyenne);
      dessinerPoids();
    }

    function dessiner(semaines, moyenne) {
      const N = semaines.length;
      const L = 600, H = 230;
      const gauche = 34, droite = 14, haut = 16, bas = 34;
      const max = Math.max(5, Math.max.apply(null, semaines.map(function (w) { return w.n; })));

      const X = function (i) { return gauche + i * (L - gauche - droite) / (N - 1); };
      const Y = function (v) { return haut + (H - haut - bas) * (1 - v / max); };

      let svg = "";

      // Grille horizontale et valeurs de l'axe vertical
      for (let v = 0; v <= max; v++) {
        svg += '<line class="grille" x1="' + gauche + '" x2="' + (L - droite) +
               '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>';
        svg += '<text class="axe" x="' + (gauche - 8) + '" y="' + (Y(v) + 4) +
               '" text-anchor="end">' + v + '</text>';
      }

      // Ligne de moyenne
      svg += '<line class="moyenne" x1="' + gauche + '" x2="' + (L - droite) +
             '" y1="' + Y(moyenne) + '" y2="' + Y(moyenne) + '"/>';

      // Courbe
      const points = semaines.map(function (w, i) { return X(i) + "," + Y(w.n); }).join(" ");
      svg += '<polyline class="courbe" points="' + points + '"/>';

      // Points et dates (moins de dates si la période est longue)
      const pas = Math.ceil(N / 8);
      semaines.forEach(function (w, i) {
        svg += '<circle class="point" cx="' + X(i) + '" cy="' + Y(w.n) + '" r="4.5"/>';
        if (i % pas === 0 || i === N - 1) {
          const label = enDate(w.debut).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
          svg += '<text class="axe" x="' + X(i) + '" y="' + (H - 10) +
                 '" text-anchor="middle">' + label + '</text>';
        }
      });

      document.getElementById("graphique").innerHTML =
        '<svg viewBox="0 0 ' + L + ' ' + H + '" role="img" ' +
        'aria-label="Courbe du nombre de séances par semaine">' + svg + '</svg>';
    }

    /* ---------- Poids ---------- */

    function formaterPoids(v) {
      return Number(v).toFixed(1).replace(".", ",");
    }

    function dessinerPoids() {
      const N = parseInt(document.getElementById("periode").value, 10);
      const zone = document.getElementById("graphique-poids");
      const actuel = document.getElementById("poids-actuel");
      const evolution = document.getElementById("poids-evolution");

      // Poids actuel : la dernière valeur enregistrée
      actuel.textContent = poids.length
        ? formaterPoids(poids[poids.length - 1].valeur) + " kg"
        : "—";

      // Valeurs de la période, une seule par jour (la dernière saisie)
      const limite = enDate(versTexte(new Date()));
      limite.setDate(limite.getDate() - N * 7);
      const limiteTexte = versTexte(limite);
      const parJour = {};
      poids.forEach(function (p) {
        if (p.date >= limiteTexte) parJour[p.date] = Number(p.valeur);
      });
      const jours = Object.keys(parJour).sort();

      if (jours.length < 2) {
        evolution.textContent = "—";
        zone.innerHTML = '<div class="vide">Enregistre ton poids sur au moins deux jours différents pour voir la courbe.</div>';
        return;
      }

      // Évolution entre la première et la dernière valeur de la période
      const delta = Math.round((parJour[jours[jours.length - 1]] - parJour[jours[0]]) * 10) / 10;
      evolution.textContent =
        (delta > 0 ? "+" : delta < 0 ? "−" : "") + formaterPoids(Math.abs(delta)) + " kg";

      // Dimensions du graphique
      const L = 600, H = 230;
      const gauche = 44, droite = 16, haut = 22, bas = 34;
      const valeurs = jours.map(function (j) { return parJour[j]; });
      const vmin = Math.floor(Math.min.apply(null, valeurs) - 0.5);
      const vmax = Math.ceil(Math.max.apply(null, valeurs) + 0.5);
      const t0 = enDate(jours[0]).getTime();
      const t1 = enDate(jours[jours.length - 1]).getTime();

      // Les points sont placés selon la vraie date, pas à intervalles réguliers
      const X = function (t) { return gauche + (t - t0) / (t1 - t0) * (L - gauche - droite); };
      const Y = function (v) { return haut + (H - haut - bas) * (1 - (v - vmin) / (vmax - vmin)); };

      let svg = "";

      // Grille et valeurs de l'axe vertical
      for (let i = 0; i <= 4; i++) {
        const v = vmin + i * (vmax - vmin) / 4;
        svg += '<line class="grille" x1="' + gauche + '" x2="' + (L - droite) +
               '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>';
        svg += '<text class="axe" x="' + (gauche - 8) + '" y="' + (Y(v) + 4) +
               '" text-anchor="end">' + formaterPoids(v) + '</text>';
      }

      // Aire sous la courbe, puis courbe
      const pts = jours.map(function (j) {
        return X(enDate(j).getTime()) + "," + Y(parJour[j]);
      });
      const bord = H - bas;
      svg += '<polygon class="aire" points="' + X(t0) + ',' + bord + ' ' +
             pts.join(" ") + ' ' + X(t1) + ',' + bord + '"/>';
      svg += '<polyline class="courbe" points="' + pts.join(" ") + '"/>';

      // Points (si pas trop nombreux) et valeur finale
      if (jours.length <= 40) {
        jours.forEach(function (j) {
          svg += '<circle class="point" cx="' + X(enDate(j).getTime()) +
                 '" cy="' + Y(parJour[j]) + '" r="4.5"/>';
        });
      }
      const dernier = jours[jours.length - 1];
      svg += '<text class="valeur-fin" x="' + (X(t1) - 6) + '" y="' + (Y(parJour[dernier]) - 12) +
             '" text-anchor="end">' + formaterPoids(parJour[dernier]) + ' kg</text>';

      // Dates sous la courbe (5 repères répartis dans le temps)
      for (let i = 0; i <= 4; i++) {
        const t = t0 + i * (t1 - t0) / 4;
        const ancre = i === 0 ? "start" : (i === 4 ? "end" : "middle");
        const label = new Date(t).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
        svg += '<text class="axe" x="' + X(t) + '" y="' + (H - 10) +
               '" text-anchor="' + ancre + '">' + label + '</text>';
      }

      zone.innerHTML =
        '<svg viewBox="0 0 ' + L + ' ' + H + '" role="img" ' +
        'aria-label="Courbe du poids">' + svg + '</svg>';
    }

    /* ---------- Progression par exercice ---------- */

    // 62.5 -> "62,5" ; 60 -> "60"
    function nb(v) {
      return String(Math.round(v * 10) / 10).replace(".", ",");
    }

    function dateFr(texte) {
      return enDate(texte).toLocaleDateString("fr-FR", {
        day: "2-digit", month: "2-digit", year: "2-digit"
      });
    }

    function carteRecord(titre, valeur, sous) {
      const c = document.createElement("div");
      c.className = "record";
      [["record-titre", titre], ["record-valeur", valeur], ["record-sous", sous]].forEach(function (p) {
        const d = document.createElement("div");
        d.className = p[0];
        d.textContent = p[1];
        c.appendChild(d);
      });
      return c;
    }

    // Remplit le menu des exercices selon la recherche
    function remplirChoixProg() {
      const select = document.getElementById("choix-prog");
      select.innerHTML = "";

      const mots = normaliser(document.getElementById("recherche-prog").value)
        .split(" ").filter(Boolean);
      const trouves = exercicesProg.filter(function (e) {
        const texte = normaliser(e.nom + " " + e.muscle);
        return mots.every(function (m) { return texte.indexOf(m) !== -1; });
      });

      MUSCLES.forEach(function (muscle) {
        const dans = trouves.filter(function (e) { return e.muscle === muscle; });
        if (dans.length === 0) return;
        const groupe = document.createElement("optgroup");
        groupe.label = muscle;
        dans.forEach(function (e) {
          const option = document.createElement("option");
          option.value = e.id;
          option.textContent = e.nom;
          if (e.id === idProg) option.selected = true;
          groupe.appendChild(option);
        });
        select.appendChild(groupe);
      });
    }

    async function changerExerciceProg() {
      const valeur = document.getElementById("choix-prog").value;
      const contenu = document.getElementById("prog-contenu");
      const aucune = document.getElementById("prog-aucune");

      if (!valeur) {
        contenu.hidden = true;
        aucune.textContent = "Aucun exercice ne correspond à cette recherche.";
        aucune.hidden = false;
        idCharge = null;
        return;
      }

      idProg = Number(valeur);
      if (idProg !== idCharge) {
        donneesProg = await chargerHistoriqueExercice(idProg);
        idCharge = idProg;
      }
      afficherProg();
    }

    function afficherProg() {
      const contenu = document.getElementById("prog-contenu");
      const aucune = document.getElementById("prog-aucune");

      // Regroupe les séries par date de séance
      const parDate = {};
      donneesProg.forEach(function (l) {
        const d = l.seances.date;
        if (!parDate[d]) parDate[d] = { date: d, series: [] };
        parDate[d].series.push({ rep: l.repetitions, charge: Number(l.charge) });
      });
      const liste = Object.keys(parDate).sort().map(function (d) { return parDate[d]; });

      if (liste.length === 0) {
        contenu.hidden = true;
        aucune.textContent = "Aucune donnée pour cet exercice. Ajoute-le à une séance dans l’onglet Activité.";
        aucune.hidden = false;
        return;
      }
      aucune.hidden = true;
      contenu.hidden = false;

      // Chiffres de chaque séance
      liste.forEach(function (s) {
        const charges = s.series.map(function (x) { return x.charge; });
        const reps = s.series.map(function (x) { return x.rep; });
        s.chargeMax = Math.max.apply(null, charges);
        s.rm = Math.max.apply(null, s.series.map(function (x) { return x.charge * (1 + x.rep / 30); }));
        s.volume = s.series.reduce(function (a, x) { return a + x.rep * x.charge; }, 0);
        s.repsMax = Math.max.apply(null, reps);
        s.repsTotal = reps.reduce(function (a, r) { return a + r; }, 0);
      });

      // En cas d'égalité, le record reste à la première séance qui l'a atteint
      function meilleur(cle) {
        return liste.reduce(function (m, s) { return s[cle] > m[cle] ? s : m; }, liste[0]);
      }

      const avecCharge = liste.some(function (s) { return s.chargeMax > 0; });

      // Cartes de records
      const records = document.getElementById("records");
      records.innerHTML = "";
      if (avecCharge) {
        const rc = meilleur("chargeMax");
        const repsAuRecord = Math.max.apply(null, rc.series
          .filter(function (x) { return x.charge === rc.chargeMax; })
          .map(function (x) { return x.rep; }));
        records.appendChild(carteRecord("Charge max", nb(rc.chargeMax) + " kg × " + repsAuRecord, dateFr(rc.date)));

        const rr = meilleur("rm");
        records.appendChild(carteRecord("1RM estimé", nb(rr.rm) + " kg", dateFr(rr.date)));

        const rv = meilleur("volume");
        records.appendChild(carteRecord("Volume max", Math.round(rv.volume).toLocaleString("fr-FR") + " kg", dateFr(rv.date)));
      } else {
        const rm = meilleur("repsMax");
        records.appendChild(carteRecord("Répétitions max", rm.repsMax + " reps", dateFr(rm.date)));

        const rt = meilleur("repsTotal");
        records.appendChild(carteRecord("Total sur une séance", rt.repsTotal + " reps", dateFr(rt.date)));
      }
      records.appendChild(carteRecord("Séances", String(liste.length),
        "Dernière : " + dateFr(liste[liste.length - 1].date)));

      // Courbe : mesures disponibles selon l'exercice
      const metriques = avecCharge
        ? [["chargeMax", "Charge max (kg)", 1], ["rm", "1RM estimé (kg)", 1], ["volume", "Volume de la séance (kg)", 0]]
        : [["repsMax", "Répétitions max (une série)", 0], ["repsTotal", "Total de répétitions", 0]];

      const selM = document.getElementById("metrique");
      const actuelle = selM.value;
      selM.innerHTML = "";
      metriques.forEach(function (m) {
        const option = document.createElement("option");
        option.value = m[0];
        option.textContent = m[1];
        selM.appendChild(option);
      });
      if (metriques.some(function (m) { return m[0] === actuelle; })) selM.value = actuelle;

      const choix = metriques.find(function (m) { return m[0] === selM.value; });
      dessinerProg(liste.map(function (s) {
        return { t: enDate(s.date).getTime(), v: s[choix[0]] };
      }), choix[2]);

      document.getElementById("prog-note").textContent = avecCharge
        ? "1RM estimé : charge maximale théorique sur une répétition (formule d’Epley), à prendre comme une estimation."
        : "";
    }

    function dessinerProg(points, decimales) {
      const zone = document.getElementById("graphique-prog");
      if (points.length < 2) {
        zone.innerHTML = '<div class="vide">Il faut au moins deux séances avec cet exercice pour voir la courbe.</div>';
        return;
      }

      const L = 600, H = 230;
      const gauche = 46, droite = 16, haut = 26, bas = 34;
      const vals = points.map(function (p) { return p.v; });
      const mini = Math.min.apply(null, vals);
      const maxi = Math.max.apply(null, vals);

      // Axe vertical : bornes entières, graduations régulières
      const marge = Math.max(1, (maxi - mini) * 0.15);
      const vmin = Math.max(0, Math.floor(mini - marge));
      let vmax = Math.ceil(maxi + marge);
      vmax = vmin + Math.ceil((vmax - vmin) / 4) * 4;

      const t0 = points[0].t;
      const t1 = points[points.length - 1].t;
      const X = function (t) { return gauche + (t - t0) / (t1 - t0) * (L - gauche - droite); };
      const Y = function (v) { return haut + (H - haut - bas) * (1 - (v - vmin) / (vmax - vmin)); };

      let svg = "";

      for (let i = 0; i <= 4; i++) {
        const v = vmin + i * (vmax - vmin) / 4;
        svg += '<line class="grille" x1="' + gauche + '" x2="' + (L - droite) +
               '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>';
        svg += '<text class="axe" x="' + (gauche - 8) + '" y="' + (Y(v) + 4) +
               '" text-anchor="end">' + Math.round(v) + '</text>';
      }

      const pts = points.map(function (p) { return X(p.t) + "," + Y(p.v); });
      const bord = H - bas;
      svg += '<polygon class="aire" points="' + X(t0) + ',' + bord + ' ' +
             pts.join(" ") + ' ' + X(t1) + ',' + bord + '"/>';
      svg += '<polyline class="courbe" points="' + pts.join(" ") + '"/>';

      if (points.length <= 40) {
        points.forEach(function (p) {
          svg += '<circle class="point" cx="' + X(p.t) + '" cy="' + Y(p.v) + '" r="4.5"/>';
        });
      }

      const dernier = points[points.length - 1];
      svg += '<text class="valeur-fin" x="' + (X(t1) - 6) + '" y="' + (Y(dernier.v) - 12) +
             '" text-anchor="end">' + dernier.v.toFixed(decimales).replace(".", ",") + '</text>';

      for (let i = 0; i <= 4; i++) {
        const t = t0 + i * (t1 - t0) / 4;
        const ancre = i === 0 ? "start" : (i === 4 ? "end" : "middle");
        const label = new Date(t).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
        svg += '<text class="axe" x="' + X(t) + '" y="' + (H - 10) +
               '" text-anchor="' + ancre + '">' + label + '</text>';
      }

      zone.innerHTML =
        '<svg viewBox="0 0 ' + L + ' ' + H + '" role="img" ' +
        'aria-label="Courbe de progression de l\'exercice">' + svg + '</svg>';
    }

    async function initialiserProg() {
      exercicesProg = await chargerExercices();

      if (exercicesProg.length === 0) {
        document.getElementById("prog-selection").hidden = true;
        const aucune = document.getElementById("prog-aucune");
        aucune.textContent = "Ta bibliothèque est vide. Ajoute des exercices, puis saisis-les dans tes séances.";
        aucune.hidden = false;
        return;
      }

      idProg = await chargerDernierExerciceUtilise();
      remplirChoixProg();
      await changerExerciceProg();
    }

    document.getElementById("choix-prog").addEventListener("change", changerExerciceProg);
    document.getElementById("metrique").addEventListener("change", afficherProg);
    document.getElementById("recherche-prog").addEventListener("input", function () {
      remplirChoixProg();
      changerExerciceProg();
    });

    /* ---------- Démarrage ---------- */

    document.getElementById("btn-deconnexion").addEventListener("click", deconnexion);
    document.getElementById("periode").addEventListener("change", afficher);

    (async function () {
      const user = await exigerConnexion();
      if (!user) return;
      try {
        seances = await chargerSeances();
        poids = await chargerPoids();
        afficher();
        await initialiserProg();
      } catch (e) {
        alert("Erreur de chargement : " + e.message);
      }
    })();
  </script>
</body>
</html>
